<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Express</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Standalone para JSX en navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useReducer, createContext, useContext, useRef } = React;

        // --- 1. DATOS DE FALLBACK INICIAL ---
        const FALLBACK_PRODUCTS = [
            {
                "Tipo de producto": "Tecnologia",
                "Detalles del producto ( opcional )": "Herramienta avanzada para el monitoreo de tu salud con bioimpedancia[span_2](start_span)[span_2](end_span).",
                "id": "p010",
                "link_foto": "https://i0.wp.com/d39ru7awumhhs2.cloudfront.net/colombia/products/998204/1721506941D_NQ_NP_977936-MLU73467456468_122023-O.webp?w=300&strip=all&quality=60",
                "cantidad": 5,
                "producto_Nombre": "Bascula Digital Pro",
                "precio_venta": 56000,
                "seo": "báscula inteligente, pesa personal, bluetooth"
            }
        ];

        // --- 2. CONTEXT Y REDUCER (ESTADO GLOBAL) ---
        const StoreContext = createContext();

        const initialStoreState = {
            products: FALLBACK_PRODUCTS,
            cart: [],
            likes: {},
            affiliateRef: 'directo',
            tamperedAlerts: [],
            checkoutForm: { name: '', phone: '', address: '', paymentMethod: 'Nequi', notes: '' },
            loading: true,
            toastMessage: null
        };

        function storeReducer(state, action) {
            switch (action.type) {
                case 'SET_PRODUCTS':
                    return { ...state, products: action.payload, loading: false };
                case 'ADD_TO_CART': {
                    const { product, quantity, selectedColor } = action.payload;
                    const existingIndex = state.cart.findIndex(
                        item => item.id === product.id && item.selectedColor === selectedColor
                    );
                    let updatedCart = [...state.cart];
                    if (existingIndex > -1) {
                        updatedCart[existingIndex].quantity += quantity;
                    } else {
                        updatedCart.push({ ...product, quantity, selectedColor });
                    }
                    return { ...state, cart: updatedCart, toastMessage: `¡${product.producto_Nombre} añadido al carrito!` };
                }
                case 'UPDATE_QUANTITY': {
                    const { index, quantity } = action.payload;
                    let updatedCart = [...state.cart];
                    if (quantity <= 0) {
                        updatedCart.splice(index, 1);
                    } else {
                        updatedCart[index].quantity = quantity;
                    }
                    return { ...state, cart: updatedCart };
                }
                case 'SET_SHARED_CART':
                    return { ...state, cart: action.payload.items, tamperedAlerts: action.payload.alerts };
                case 'TOGGLE_LIKE': {
                    const newLikes = { ...state.likes, [action.payload]: !state.likes[action.payload] };
                    return { ...state, likes: newLikes, toastMessage: newLikes[action.payload] ? 'Añadido a favoritos ❤️' : 'Eliminado de favoritos' };
                }
                case 'SET_AFFILIATE':
                    return { ...state, affiliateRef: action.payload };
                case 'UPDATE_CHECKOUT_FORM':
                    return { ...state, checkoutForm: { ...state.checkoutForm, ...action.payload } };
                case 'SET_TOAST':
                    return { ...state, toastMessage: action.payload };
                default:
                    return state;
            }
        }

        function StoreProvider({ children }) {
            const [state, dispatch] = useReducer(storeReducer, initialStoreState, (initial) => {
                try {
                    const localCart = localStorage.getItem('ecommerce_cart');
                    const localLikes = localStorage.getItem('ecommerce_likes');
                    const localForm = localStorage.getItem('ecommerce_form');
                    return {
                        ...initial,
                        cart: localCart ? JSON.parse(localCart) : initial.cart,
                        likes: localLikes ? JSON.parse(localLikes) : initial.likes,
                        checkoutForm: localForm ? JSON.parse(localForm) : initial.checkoutForm
                    };
                } catch {
                    return initial;
                }
            });

            // Cargar JSON con versión y caché[span_3](start_span)[span_3](end_span)
            useEffect(() => {
                const version = Date.now();
                fetch(`https://ivn6.github.io/JHNPTA/productos.json?v=${version}`)
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data) && data.length > 0) {
                            dispatch({ type: 'SET_PRODUCTS', payload: data });
                            localStorage.setItem('cached_products', JSON.stringify(data));
                        }
                    })
                    .catch(() => {
                        const cached = localStorage.getItem('cached_products');
                        if (cached) dispatch({ type: 'SET_PRODUCTS', payload: JSON.parse(cached) });
                        else dispatch({ type: 'SET_PRODUCTS', payload: FALLBACK_PRODUCTS });
                    });
            }, []);

            // Procesar URL (Afiliado, Carrito compartido y Producto directo)
            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const ref = urlParams.get('ref');
                const encodedCart = urlParams.get('cart');

                if (ref) {
                    dispatch({ type: 'SET_AFFILIATE', payload: ref });
                    localStorage.setItem('affiliate_ref', ref);
                }

                if (encodedCart && state.products.length > 0) {
                    try {
                        const decoded = JSON.parse(atob(encodedCart));
                        let alerts = [];
                        let validItems = decoded.map(sharedItem => {
                            const official = state.products.find(p => p.id == sharedItem.id);
                            if (!official) {
                                alerts.push(`El producto ID ${sharedItem.id} ya no está disponible.`);
                                return null;
                            }
                            const officialPrice = official.precio_venta;
                            if (sharedItem.price !== officialPrice) {
                                alerts.push(`Se ajustó el precio de "${official.producto_Nombre}" al valor oficial ($${officialPrice.toLocaleString()}).`);
                            }
                            return {
                                ...official,
                                price: officialPrice,
                                quantity: sharedItem.quantity,
                                selectedColor: sharedItem.selectedColor || ''
                            };
                        }).filter(Boolean);

                        dispatch({ type: 'SET_SHARED_CART', payload: { items: validItems, alerts } });
                    } catch {
                        dispatch({ type: 'SET_SHARED_CART', payload: { items: [], alerts: ["El enlace del carrito compartido es inválido."] } });
                    }
                }
            }, [state.products]);

            useEffect(() => { localStorage.setItem('ecommerce_cart', JSON.stringify(state.cart)); }, [state.cart]);
            useEffect(() => { localStorage.setItem('ecommerce_likes', JSON.stringify(state.likes)); }, [state.likes]);
            useEffect(() => { localStorage.setItem('ecommerce_form', JSON.stringify(state.checkoutForm)); }, [state.checkoutForm]);

            return (
                <StoreContext.Provider value={{ state, dispatch }}>
                    {children}
                </StoreContext.Provider>
            );
        }

        const useStore = () => useContext(StoreContext);

        // --- 3. TOAST NOTIFICACIÓN FLOTANTE ---
        function Toast() {
            const { state, dispatch } = useStore();
            useEffect(() => {
                if (state.toastMessage) {
                    const timer = setTimeout(() => {
                        dispatch({ type: 'SET_TOAST', payload: null });
                    }, 3000);
                    return () => clearTimeout(timer);
                }
            }, [state.toastMessage]);

            if (!state.toastMessage) return null;

            return (
                <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-black/90 text-white px-4 py-2.5 rounded-2xl text-xs font-semibold shadow-xl backdrop-blur-md transition animate-bounce">
                    {state.toastMessage}
                </div>
            );
        }

        // --- 4. LAZY IMAGE ---
        function LazyImage({ src, alt, className }) {
            const [isLoaded, setIsLoaded] = useState(false);
            const [isInView, setIsInView] = useState(false);
            const imgRef = useRef();

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setIsInView(true);
                        observer.disconnect();
                    }
                }, { rootMargin: '200px' });
                if (imgRef.current) observer.observe(imgRef.current);
                return () => observer.disconnect();
            }, []);

            return (
                <div ref={imgRef} className={`relative overflow-hidden bg-gray-50 flex items-center justify-center ${className}`}>
                    {isInView && (
                        <img
                            src={src}
                            alt={alt}
                            loading="lazy"
                            onLoad={() => setIsLoaded(true)}
                            className={`w-full h-full object-contain transition-opacity duration-300 ${isLoaded ? 'opacity-100' : 'opacity-0'}`}
                        />
                    )}
                    {!isLoaded && (
                        <div className="absolute inset-0 animate-pulse bg-gray-200 flex items-center justify-center text-[10px] text-gray-400">
                            Cargando...
                        </div>
                    )}
                </div>
            );
        }

        // --- 5. TARJETA DE PRODUCTO ---
        function ProductCard({ product, onSelect }) {
            const { state, dispatch } = useStore();
            const isLiked = state.likes[product.id];
            const isOutOfStock = product.cantidad === 0;

            const handleQuickAddToCart = (e) => {
                e.stopPropagation();
                if (isOutOfStock) return;
                const colorsList = product.colores ? product.colores.split(',').map(c => c.trim()) : [];
                dispatch({
                    type: 'ADD_TO_CART',
                    payload: {
                        product: {
                            id: product.id,
                            producto_Nombre: product.producto_Nombre,
                            price: product.precio_venta,
                            link_foto: product.link_foto,
                            category: product["Tipo de producto"]
                        },
                        quantity: 1,
                        selectedColor: colorsList[0] || ''
                    }
                });
            };

            const handleShareProduct = (e) => {
                e.stopPropagation();
                const ref = state.affiliateRef || 'directo';
                const shareUrl = `${window.location.origin}${window.location.pathname}?ref=${ref}&product=${product.id}`;
                const waText = `¡Mira este producto en nuestra tienda! 🛍️\n*${product.producto_Nombre}*\nPrecio: $${product.precio_venta?.toLocaleString()}\n\nVer aquí: ${shareUrl}`;
                window.open(`https://wa.me/?text=${encodeURIComponent(waText)}`, '_blank');
            };

            return (
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-3 flex flex-col justify-between transition-all hover:shadow-md">
                    <div>
                        <div className="relative rounded-xl overflow-hidden mb-2 aspect-square cursor-pointer bg-gray-50" onClick={() => onSelect(product)}>
                            <LazyImage src={product.link_foto} alt={product.producto_Nombre} className="w-full h-full rounded-xl" />
                            {product.oferta && (
                                <span className="absolute top-2 left-2 bg-rose-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow z-10">
                                    ¡Oferta!
                                </span>
                            )}
                            {isOutOfStock && (
                                <div className="absolute inset-0 bg-black/40 flex items-center justify-center z-10">
                                    <span className="bg-white text-gray-900 text-xs font-black px-2.5 py-1 rounded-lg uppercase tracking-wider">Agotado</span>
                                </div>
                            )}
                            <button
                                onClick={(e) => { e.stopPropagation(); dispatch({ type: 'TOGGLE_LIKE', payload: product.id }); }}
                                className="absolute top-2 right-2 bg-white/90 p-1.5 rounded-full shadow text-sm transition active:scale-90 z-10"
                            >
                                {isLiked ? '❤️' : '🤍'}
                            </button>
                        </div>
                        <span className="text-[10px] font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">
                            {product["Tipo de producto"]}
                        </span>
                        <h3 className="font-semibold text-xs text-gray-900 line-clamp-2 mt-1 cursor-pointer" onClick={() => onSelect(product)}>
                            {product.producto_Nombre}
                        </h3>
                        <div className="flex items-center justify-between mt-1">
                            <p className="text-emerald-600 font-extrabold text-sm">
                                ${product.precio_venta ? product.precio_venta.toLocaleString() : '0'}
                            </p>
                            {!isOutOfStock && product.cantidad <= 2 && (
                                <span className="text-[10px] text-amber-600 font-bold">¡Últimas unidades!</span>
                            )}
                        </div>
                    </div>

                    <div className="pt-2 border-t border-gray-100 mt-2 flex gap-1.5">
                        <button
                            onClick={handleQuickAddToCart}
                            disabled={isOutOfStock}
                            className={`flex-1 py-2 rounded-xl text-xs font-bold transition ${isOutOfStock ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-black text-white active:scale-95'}`}
                        >
                            {isOutOfStock ? 'Agotado' : 'Añadir 🛒'}
                        </button>
                        <button
                            onClick={() => onSelect(product)}
                            className="bg-gray-100 text-gray-800 px-2.5 py-2 rounded-xl text-xs font-bold active:scale-95 transition"
                            title="Ver detalles"
                        >
                            👁️
                        </button>
                        <button
                            onClick={handleShareProduct}
                            className="bg-emerald-50 text-emerald-700 px-2.5 py-2 rounded-xl text-xs font-bold border border-emerald-200 active:scale-95 transition"
                            title="Compartir por WhatsApp"
                        >
                            🔗
                        </button>
                    </div>
                </div>
            );
        }

        // --- 6. MODAL DE DETALLE DE PRODUCTO ---
        function ProductDetailModal({ product, onClose }) {
            const { dispatch, state } = useStore();
            const [selectedColor, setSelectedColor] = useState('');
            const [quantity, setQuantity] = useState(1);

            const colorsList = product && product.colores ? product.colores.split(',').map(c => c.trim()) : [];

            useEffect(() => {
                if (colorsList.length > 0) setSelectedColor(colorsList[0]);
            }, [product]);

            if (!product) return null;

            const isOutOfStock = product.cantidad === 0;

            const handleAddToCart = () => {
                if (isOutOfStock) return;
                dispatch({
                    type: 'ADD_TO_CART',
                    payload: {
                        product: {
                            id: product.id,
                            producto_Nombre: product.producto_Nombre,
                            price: product.precio_venta,
                            link_foto: product.link_foto,
                            category: product["Tipo de producto"]
                        },
                        quantity,
                        selectedColor
                    }
                });
                onClose();
            };

            const handleShareThisProduct = () => {
                const ref = state.affiliateRef || 'directo';
                const shareUrl = `${window.location.origin}${window.location.pathname}?ref=${ref}&product=${product.id}`;
                const waText = `¡Mira este artículo recomendado! 🌟\n*${product.producto_Nombre}*\nPrecio: $${product.precio_venta?.toLocaleString()}\n\nCómpralo aquí: ${shareUrl}`;
                window.open(`https://wa.me/?text=${encodeURIComponent(waText)}`, '_blank');
            };

            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
                    <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto shadow-2xl">
                        <div className="flex justify-between items-center mb-3 pb-2 border-b">
                            <h2 className="font-bold text-base text-gray-900">Detalles del Producto</h2>
                            <button onClick={onClose} className="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center font-bold">✕</button>
                        </div>

                        {/* Imagen ampliada con mayor proporción visual */}
                        <div className="relative rounded-2xl overflow-hidden mb-4 bg-gray-50 h-80 sm:h-96 w-full flex items-center justify-center">
                            <img src={product.link_foto} alt={product.producto_Nombre} className="w-full h-full object-contain rounded-2xl p-2" />
                            {isOutOfStock && (
                                <div className="absolute inset-0 bg-black/40 flex items-center justify-center">
                                    <span className="bg-white text-gray-900 text-sm font-black px-4 py-1.5 rounded-xl uppercase tracking-wider">Agotado</span>
                                </div>
                            )}
                        </div>

                        <div className="flex justify-between items-center">
                            <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg">
                                {product["Tipo de producto"]}
                            </span>
                            <button onClick={handleShareThisProduct} className="text-xs font-bold bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-xl border border-emerald-200">
                                🔗 Compartir Producto
                            </button>
                        </div>

                        <h1 className="font-bold text-lg text-gray-900 mt-2">{product.producto_Nombre}</h1>
                        <p className="text-emerald-600 font-black text-xl mt-1">${product.precio_venta?.toLocaleString()}</p>

                        <div className="my-3 text-xs text-gray-600 bg-gray-50 p-3 rounded-xl leading-relaxed">
                            <div dangerouslySetInnerHTML={{ __html: product["Detalles del producto ( opcional )"] || 'Sin descripción detallada.' }} />
                        </div>

                        {colorsList.length > 0 && (
                            <div className="my-3">
                                <label className="text-xs font-bold text-gray-700 block mb-1">Color disponible:</label>
                                <div className="flex gap-2">
                                    {colorsList.map(color => (
                                        <button
                                            key={color}
                                            onClick={() => setSelectedColor(color)}
                                            className={`px-3 py-1 rounded-lg text-xs font-semibold border ${selectedColor === color ? 'bg-black text-white border-black' : 'bg-white text-gray-700 border-gray-200'}`}
                                        >
                                            {color}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {!isOutOfStock && (
                            <div className="flex items-center justify-between my-4 py-2 border-t border-b">
                                <span className="text-xs font-bold text-gray-700">Cantidad:</span>
                                <div className="flex items-center border rounded-xl bg-gray-50">
                                    <button onClick={() => setQuantity(Math.max(1, quantity - 1))} className="px-3 py-1 text-sm font-bold">-</button>
                                    <span className="px-3 text-xs font-bold">{quantity}</span>
                                    <button onClick={() => setQuantity(quantity + 1)} className="px-3 py-1 text-sm font-bold">+</button>
                                </div>
                            </div>
                        )}

                        <button
                            onClick={handleAddToCart}
                            disabled={isOutOfStock}
                            className={`w-full py-3 rounded-2xl font-bold text-sm shadow-lg transition ${isOutOfStock ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-black text-white active:scale-95'}`}
                        >
                            {isOutOfStock ? 'Producto Agotado' : 'Añadir al Carrito 🛒'}
                        </button>
                    </div>
                </div>
            );
        }

        // --- 7. MODAL DE CARRITO Y CHECKOUT EXPRESS ---
        function CartCheckoutModal({ isOpen, onClose }) {
            const { state, dispatch } = useStore();
            const { checkoutForm } = state;

            if (!isOpen) return null;

            const total = state.cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);

            const handleFormChange = (e) => {
                dispatch({ type: 'UPDATE_CHECKOUT_FORM', payload: { [e.target.name]: e.target.value } });
            };

            const handleSubmitWhatsApp = (e) => {
                e.preventDefault();
                const affiliateInfo = state.affiliateRef && state.affiliateRef !== 'directo' ? `🔗 *Asesor / Afiliado:* ${state.affiliateRef}\n` : '';
                const itemsText = state.cart.map(i => `- ${i.quantity}x *${i.producto_Nombre}* ${i.selectedColor ? `(${i.selectedColor})` : ''} [$${(i.price * i.quantity).toLocaleString()}]`).join('\n');
                const notesText = checkoutForm.notes ? `📝 *Notas adicionales:* ${checkoutForm.notes}\n` : '';
                
                // Generar link cifrado del carrito automáticamente dentro del mensaje
                const cartPayload = btoa(JSON.stringify(state.cart.map(i => ({
                    id: i.id,
                    price: i.price,
                    quantity: i.quantity,
                    selectedColor: i.selectedColor
                }))));
                const ref = state.affiliateRef || 'directo';
                const shareCartUrl = `${window.location.origin}${window.location.pathname}?ref=${ref}&cart=${cartPayload}`;

                const message = `🛒 *NUEVO PEDIDO DE E-COMMERCE*\n\n` +
                    `${affiliateInfo}` +
                    `👤 *Cliente:* ${checkoutForm.name}\n` +
                    `📞 *Teléfono:* ${checkoutForm.phone}\n` +
                    `📍 *Dirección:* ${checkoutForm.address}\n` +
                    `💳 *Pago:* ${checkoutForm.paymentMethod}\n` +
                    `${notesText}\n` +
                    `📦 *Productos:*\n${itemsText}\n\n` +
                    `🔗 *Enlace de verificación:* ${shareCartUrl}\n\n` +
                    `💰 *Total a pagar:* $${total.toLocaleString()}`;

                const whatsappUrl = `https://wa.me/573247356178?text=${encodeURIComponent(message)}`;
                window.open(whatsappUrl, '_blank');
            };

            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
                    <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto shadow-2xl">
                        <div className="flex justify-between items-center mb-4 pb-2 border-b">
                            <h2 className="font-bold text-base text-gray-900">Tu Carrito y Pago</h2>
                            <button onClick={onClose} className="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center font-bold">✕</button>
                        </div>

                        {state.tamperedAlerts.length > 0 && (
                            <div className="bg-amber-50 border border-amber-200 text-amber-900 p-3 rounded-xl text-xs mb-3 space-y-1">
                                {state.tamperedAlerts.map((alert, idx) => <p key={idx}>⚠️ {alert}</p>)}
                            </div>
                        )}

                        {state.cart.length === 0 ? (
                            <div className="text-center py-10 text-gray-400 text-sm">Tu carrito está vacío 🛍️</div>
                        ) : (
                            <div className="space-y-4">
                                <div className="divide-y max-h-48 overflow-y-auto pr-1">
                                    {state.cart.map((item, idx) => (
                                        <div key={idx} className="py-2.5 flex items-center justify-between text-xs gap-2">
                                            <div className="flex items-center gap-2">
                                                <img src={item.link_foto} alt="" className="w-10 h-10 rounded-lg object-contain bg-gray-50" />
                                                <div>
                                                    <p className="font-bold text-gray-900 line-clamp-1">{item.producto_Nombre}</p>
                                                    <p className="text-gray-500 text-[10px]">{item.selectedColor}</p>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <span className="font-bold text-emerald-600">${(item.price * item.quantity).toLocaleString()}</span>
                                                <div className="flex items-center border rounded-lg bg-gray-50">
                                                    <button onClick={() => dispatch({type: 'UPDATE_QUANTITY', payload: {index: idx, quantity: item.quantity - 1}})} className="px-2 py-0.5">-</button>
                                                    <span className="px-1.5">{item.quantity}</span>
                                                    <button onClick={() => dispatch({type: 'UPDATE_QUANTITY', payload: {index: idx, quantity: item.quantity + 1}})} className="px-2 py-0.5">+</button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <form onSubmit={handleSubmitWhatsApp} className="space-y-3 pt-2 border-t">
                                    <h3 className="font-bold text-xs text-gray-700 uppercase tracking-wider">Información de Envío</h3>
                                    <div>
                                        <label className="text-xs text-gray-500">Nombre Completo</label>
                                        <input required name="name" type="text" value={checkoutForm.name} onChange={handleFormChange} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-500">Teléfono / WhatsApp</label>
                                        <input required name="phone" type="tel" value={checkoutForm.phone} onChange={handleFormChange} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-500">Dirección de Entrega</label>
                                        <input required name="address" type="text" value={checkoutForm.address} onChange={handleFormChange} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-500">Método de Pago</label>
                                        <select name="paymentMethod" value={checkoutForm.paymentMethod} onChange={handleFormChange} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50">
                                            <option value="Nequi">Nequi</option>
                                            <option value="Daviplata">Daviplata</option>
                                            <option value="Contra Entrega">Pago Contra Entrega</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-500">Comentarios o notas adicionales (Opcional)</label>
                                        <textarea name="notes" placeholder="Ej. Mi número de Nequi es distinto, dejar con el vecino..." value={checkoutForm.notes} onChange={handleFormChange} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50 h-16 resize-none"></textarea>
                                    </div>

                                    <div className="bg-gray-50 p-3 rounded-xl text-xs space-y-1">
                                        <div className="flex justify-between font-bold text-sm text-black"><span>Total a Pagar:</span><span>${total.toLocaleString()}</span></div>
                                    </div>

                                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-extrabold text-sm shadow-lg transition active:scale-95">
                                        Enviar Pedido a WhatsApp 🚀
                                    </button>
                                </form>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- 8. MENÚ LATERAL (HAMBURGUESA) ---
        function DrawerMenu({ isOpen, onClose, onSelectProduct }) {
            const { state } = useStore();
            const likedIds = Object.keys(state.likes).filter(id => state.likes[id]);
            const likedProducts = state.products.filter(p => likedIds.includes(String(p.id)));

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex justify-end backdrop-blur-sm">
                    <div className="bg-white w-80 h-full p-5 shadow-2xl flex flex-col justify-between overflow-y-auto">
                        <div>
                            <div className="flex justify-between items-center mb-5 pb-2 border-b">
                                <h2 className="font-bold text-base text-gray-900">Menú y Favoritos</h2>
                                <button onClick={onClose} className="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center font-bold">✕</button>
                            </div>

                            <div className="space-y-4">
                                <div className="bg-indigo-50 p-3.5 rounded-2xl">
                                    <p className="text-xs font-bold text-indigo-900 mb-2">❤️ Mis Favoritos ({likedProducts.length})</p>
                                    {likedProducts.length === 0 ? (
                                        <p className="text-[11px] text-indigo-600">No tienes productos guardados aún.</p>
                                    ) : (
                                        <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                                            {likedProducts.map(p => (
                                                <div key={p.id} onClick={() => { onClose(); onSelectProduct(p); }} className="flex items-center gap-2 bg-white p-2 rounded-xl cursor-pointer hover:shadow-sm">
                                                    <img src={p.link_foto} alt="" className="w-8 h-8 rounded-lg object-contain bg-gray-50" />
                                                    <div className="flex-1 min-w-0">
                                                        <p className="text-[11px] font-bold text-gray-800 truncate">{p.producto_Nombre}</p>
                                                        <p className="text-[10px] text-emerald-600 font-bold">${p.precio_venta?.toLocaleString()}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="pt-4 border-t text-center text-[11px] text-gray-400">
                            Tienda Express • Catálogo Inteligente
                        </div>
                    </div>
                </div>
            );
        }

        // --- 9. APLICACIÓN PRINCIPAL ---
        function App() {
            const { state } = useStore();
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('todos');
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [selectedProduct, setSelectedProduct] = useState(null);

            // Manejo de Historial (Botón "Atrás" del navegador cierra modales)
            useEffect(() => {
                const handlePopState = () => {
                    if (selectedProduct) setSelectedProduct(null);
                    if (isCartOpen) setIsCartOpen(false);
                    if (isMenuOpen) setIsMenuOpen(false);
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, [selectedProduct, isCartOpen, isMenuOpen]);

            const openProductModal = (product) => {
                window.history.pushState({ modal: 'product' }, '');
                setSelectedProduct(product);
            };

            const closeProductModal = () => {
                if (window.history.state?.modal === 'product') window.history.back();
                setSelectedProduct(null);
            };

            const openCartModal = () => {
                window.history.pushState({ modal: 'cart' }, '');
                setIsCartOpen(true);
            };

            const closeCartModal = () => {
                if (window.history.state?.modal === 'cart') window.history.back();
                setIsCartOpen(false);
            };

            const openMenuModal = () => {
                window.history.pushState({ modal: 'menu' }, '');
                setIsMenuOpen(true);
            };

            const closeMenuModal = () => {
                if (window.history.state?.modal === 'menu') window.history.back();
                setIsMenuOpen(false);
            };

            // Detectar parámetro ?product=ID al cargar para mostrar el producto directamente
            useEffect(() => {
                if (!state.loading && state.products.length > 0) {
                    const urlParams = new URLSearchParams(window.location.search);
                    const prodId = urlParams.get('product');
                    if (prodId) {
                        const found = state.products.find(p => String(p.id) === String(prodId));
                        if (found) setSelectedProduct(found);
                    }
                }
            }, [state.loading, state.products]);

            const categories = ['todos', ...new Set(state.products.map(p => p["Tipo de producto"]).filter(Boolean))];

            const filteredProducts = state.products.filter(p => {
                const matchesCategory = selectedCategory === 'todos' || p["Tipo de producto"] === selectedCategory;
                const searchLower = searchTerm.toLowerCase();
                const nameMatch = p.producto_Nombre?.toLowerCase().includes(searchLower);
                const typeMatch = p["Tipo de producto"]?.toLowerCase().includes(searchLower);
                const seoMatch = p.seo?.toLowerCase().includes(searchLower);
                const detailsMatch = p["Detalles del producto ( opcional )"]?.toLowerCase().includes(searchLower);
                const colorMatch = p.colores?.toLowerCase().includes(searchLower);

                const matchesSearch = !searchTerm || nameMatch || typeMatch || seoMatch || detailsMatch || colorMatch;
                return matchesCategory && matchesSearch;
            });

            const totalCartItems = state.cart.reduce((acc, item) => acc + item.quantity, 0);

            if (state.loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-center space-y-2">
                            <div className="w-8 h-8 border-4 border-black border-t-transparent rounded-full animate-spin mx-auto"></div>
                            <p className="text-xs font-semibold text-gray-500">Cargando catálogo inteligente...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-20">
                    <Toast />

                    {/* Header Principal Fijo */}
                    <header className="sticky top-0 bg-white/95 backdrop-blur-md z-40 border-b border-gray-100 px-4 py-3 shadow-sm">
                        <div className="max-w-2xl mx-auto flex items-center justify-between gap-2">
                            <button onClick={openMenuModal} className="p-2 bg-gray-100 rounded-xl text-sm font-bold">
                                ☰
                            </button>
                            <div className="relative flex-1 max-w-xs">
                                <input
                                    type="text"
                                    placeholder="Buscar productos, colores, detalles..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full bg-gray-100 border border-transparent focus:border-black rounded-full px-3.5 py-1.5 pr-8 text-xs outline-none transition"
                                />
                                {searchTerm && (
                                    <button
                                        onClick={() => setSearchTerm('')}
                                        className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700 text-xs font-bold"
                                    >
                                        ✕
                                    </button>
                                )}
                            </div>
                            <button
                                onClick={openCartModal}
                                className="relative bg-black text-white px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 active:scale-95 transition"
                            >
                                🛒 {totalCartItems > 0 && <span className="bg-emerald-500 text-white rounded-full px-1.5 py-0.2 text-[10px]">{totalCartItems}</span>}
                            </button>
                        </div>
                    </header>

                    {/* Categorías Fijas (Sticky debajo del Header) */}
                    <nav className="sticky top-[57px] bg-white/95 backdrop-blur-md z-30 max-w-2xl mx-auto px-4 py-2.5 overflow-x-auto flex gap-2 no-scrollbar border-b border-gray-100 shadow-xs">
                        {categories.map(cat => (
                            <button
                                key={cat}
                                onClick={() => setSelectedCategory(cat)}
                                className={`whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs font-semibold transition capitalize ${selectedCategory === cat ? 'bg-black text-white shadow' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                            >
                                {cat === 'todos' ? '🔥 Todos' : cat}
                            </button>
                        ))}
                    </nav>

                    {/* Grid de Productos Adaptable (1 o 2 columnas) */}
                    <main className="max-w-2xl mx-auto px-4 py-3">
                        <div className="grid grid-cols-2 gap-3">
                            {filteredProducts.map(product => (
                                <ProductCard key={product.id} product={product} onSelect={openProductModal} />
                            ))}
                        </div>
                        {filteredProducts.length === 0 && (
                            <div className="text-center py-16 text-gray-400 text-sm">No se encontraron productos con esos filtros.</div>
                        )}
                    </main>

                    {/* Modales con soporte de historial */}
                    <ProductDetailModal product={selectedProduct} onClose={closeProductModal} />
                    <CartCheckoutModal isOpen={isCartOpen} onClose={closeCartModal} />
                    <DrawerMenu isOpen={isMenuOpen} onClose={closeMenuModal} onSelectProduct={openProductModal} />
                </div>
            );
        }

        // Renderizar la Aplicación
        ReactDOM.render(
            <StoreProvider>
                <App />
            </StoreProvider>,
            document.getElementById('root')
        );
    </script>
</body>
</html>
