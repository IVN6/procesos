        // --- 2. ESTADO GLOBAL CON REDUCER Y LOCALSTORAGE ---
        const CartContext = createContext();

        const initialCartState = {
            products: [],
            loadingProducts: true,
            cart: [],
            likes: {},
            affiliateRef: 'directo',
            tamperedAlerts: [],
            userForm: {
                name: '',
                phone: '',
                address: '',
                paymentMethod: 'Nequi'
            }
        };

        function cartReducer(state, action) {
            switch (action.type) {
                case 'SET_PRODUCTS':
                    return { ...state, products: action.payload, loadingProducts: false };
                case 'ADD_TO_CART': {
                    const { product, quantity, options, purchaseType } = action.payload;
                    const existingIndex = state.cart.findIndex(
                        item => item.id === product.id && 
                                JSON.stringify(item.options) === JSON.stringify(options) && 
                                item.purchaseType === purchaseType
                    );
                    let updatedCart = [...state.cart];
                    if (existingIndex > -1) {
                        updatedCart[existingIndex].quantity += quantity;
                    } else {
                        updatedCart.push({ ...product, quantity, options, purchaseType });
                    }
                    return { ...state, cart: updatedCart };
                }
                case 'UPDATE_QUANTITY': {
                    const { index, quantity } = action.payload;
                    let updatedCart = [...state.cart];
                    if (quantity <= 0) {
                        updatedCart.splice(index, 1);
                    } else {
                        updatedCart[index].quantity = quantity;
                    }
                    return { ...state, cart: updatedCart };
                }
                case 'SET_SHARED_CART':
                    return { ...state, cart: action.payload.items, tamperedAlerts: action.payload.alerts };
                case 'TOGGLE_LIKE': {
                    const newLikes = { ...state.likes, [action.payload]: !state.likes[action.payload] };
                    return { ...state, likes: newLikes };
                }
                case 'SET_AFFILIATE':
                    return { ...state, affiliateRef: action.payload };
                case 'UPDATE_USER_FORM':
                    return { ...state, userForm: { ...state.userForm, ...action.payload } };
                default:
                    return state;
            }
        }

        function CartProvider({ children }) {
            const [state, dispatch] = useReducer(cartReducer, initialCartState, (initial) => {
                try {
                    const localCart = localStorage.getItem('ecommerce_cart');
                    const localLikes = localStorage.getItem('ecommerce_likes');
                    const localForm = localStorage.getItem('ecommerce_user_form');
                    return {
                        ...initial,
                        cart: localCart ? JSON.parse(localCart) : [],
                        likes: localLikes ? JSON.parse(localLikes) : {},
                        userForm: localForm ? JSON.parse(localForm) : initial.userForm
                    };
                } catch {
                    return initial;
                }
            });

            // Sincronización con el JSON remoto (con respaldo local automático)
            useEffect(() => {
                const fetchProducts = async () => {
                    try {
                        const response = await fetch('https://ivn6.github.io/JHNPTA/productos.json?v=' + Date.now());
                        if (!response.ok) throw new Error('Error al conectar con servidor');
                        const data = await response.json();
                        dispatch({ type: 'SET_PRODUCTS', payload: data });
                        localStorage.setItem('ecommerce_products_cache', JSON.stringify(data));
                    } catch (err) {
                        console.warn('Usando catálogo en caché / fallback local por red o CORS:', err);
                        const cached = localStorage.getItem('ecommerce_products_cache');
                        dispatch({ 
                            type: 'SET_PRODUCTS', 
                            payload: cached ? JSON.parse(cached) : FALLBACK_PRODUCTS 
                        });
                    }
                };
                fetchProducts();
            }, []);

            // Procesar parámetros URL al iniciar (Afiliados, Carrito Compartido anti-fraude y Vista de Producto único)
            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const ref = urlParams.get('ref');
                const encodedCart = urlParams.get('cart');

                if (ref) {
                    dispatch({ type: 'SET_AFFILIATE', payload: ref });
                    localStorage.setItem('ecommerce_affiliate', ref);
                }

                if (encodedCart && state.products.length > 0) {
                    try {
                        const decoded = JSON.parse(atob(encodedCart));
                        let alerts = [];
                        let validItems = decoded.map(sharedItem => {
                            const official = state.products.find(p => String(p.id) === String(sharedItem.id));
                            if (!official) {
                                alerts.push(`El producto ID ${sharedItem.id} ya no está disponible.`);
                                return null;
                            }
                            if (Number(sharedItem.precio_venta) !== Number(official.precio_venta)) {
                                alerts.push(`El precio de "${official.producto_Nombre}" fue actualizado al oficial ($${official.precio_venta.toLocaleString()}).`);
                            }
                            return { 
                                ...official, 
                                price: official.precio_venta, 
                                quantity: sharedItem.quantity || 1,
                                options: sharedItem.options || {},
                                purchaseType: sharedItem.purchaseType || 'full'
                            };
                        }).filter(Boolean);

                        dispatch({ type: 'SET_SHARED_CART', payload: { items: validItems, alerts } });
                    } catch {
                        dispatch({ type: 'SET_SHARED_CART', payload: { items: [], alerts: ["El enlace del carrito compartido está dañado o es inválido."] } });
                    }
                }
            }, [state.products]);

            // Persistencias locales en cada cambio relevante
            useEffect(() => {
                localStorage.setItem('ecommerce_cart', JSON.stringify(state.cart));
            }, [state.cart]);

            useEffect(() => {
                localStorage.setItem('ecommerce_likes', JSON.stringify(state.likes));
            }, [state.likes]);

            useEffect(() => {
                localStorage.setItem('ecommerce_user_form', JSON.stringify(state.userForm));
            }, [state.userForm]);

            return (
                <CartContext.Provider value={{ state, dispatch }}>
                    {children}
                </CartContext.Provider>
            );
        }

        const useCart = () => useContext(CartContext);

        // --- 3. COMPONENTE DE IMAGEN CON LAZY LOADING OPTIMIZADO ---
        function LazyImage({ src, alt, className }) {
            const [isLoaded, setIsLoaded] = useState(false);
            const [isInView, setIsInView] = useState(false);
            const imgRef = useRef();

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsInView(true);
                            observer.disconnect();
                        }
                    },
                    { rootMargin: '200px' }
                );
                if (imgRef.current) observer.observe(imgRef.current);
                return () => observer.disconnect();
            }, []);

            return (
                <div ref={imgRef} className={`relative overflow-hidden bg-gray-100 ${className}`}>
                    {isInView && (
                        <img
                            src={src}
                            alt={alt}
                            loading="lazy"
                            onLoad={() => setIsLoaded(true)}
                            className={`w-full h-full object-cover transition-opacity duration-300 ${isLoaded ? 'opacity-100' : 'opacity-0'}`}
                        />
                    )}
                    {!isLoaded && (
                        <div className="absolute inset-0 animate-pulse bg-gray-200 flex items-center justify-center text-[10px] text-gray-400">
                            Cargando...
                        </div>
                    )}
                </div>
            );
        }

        // --- 7. CARRITO Y CHECKOUT MODAL ---
        function CartCheckoutModal({ isOpen, onClose }) {
            const { state, dispatch } = useCart();
            const [form, setForm] = useState(state.userForm);

            useEffect(() => {
                setForm(state.userForm);
            }, [state.userForm]);

            const handleFormChange = (field, value) => {
                const updated = { ...form, [field]: value };
                setForm(updated);
                dispatch({ type: 'UPDATE_USER_FORM', payload: updated });
            };

            if (!isOpen) return null;

            const total = state.cart.reduce((acc, item) => acc + ((item.precio_venta || item.price || 0) * item.quantity), 0);
            const isLayawayOrder = state.cart.some(i => i.purchaseType === 'layaway');
            const finalTotalToPay = isLayawayOrder ? total / 2 : total;

            const handleShareCart = () => {
                const ref = state.affiliateRef || 'directo';
                const cartPayload = btoa(JSON.stringify(state.cart.map(i => ({ 
                    id: i.id, 
                    precio_venta: i.precio_venta || i.price, 
                    quantity: i.quantity, 
                    options: i.options,
                    purchaseType: i.purchaseType 
                }))));
                const shareUrl = `${window.location.origin}${window.location.pathname}?ref=${ref}&cart=${cartPayload}`;
                
                if (navigator.share) {
                    navigator.share({ title: 'Mi Carrito de Compras', url: shareUrl });
                } else {
                    navigator.clipboard.writeText(shareUrl);
                    alert('¡Enlace de carrito copiado con éxito!');
                }
            };

            const handleSubmitWhatsApp = (e) => {
                e.preventDefault();
                const affiliateInfo = state.affiliateRef && state.affiliateRef !== 'directo' ? `🔗 *Asesor / Afiliado:* ${state.affiliateRef}\n` : '';
                
                const itemsText = state.cart.map((i, index) => 
                    `*${index + 1}.* ${i.quantity}x *${i.producto_Nombre || i.name}*\n` +
                    `   • Opciones: ${JSON.stringify(i.options)}\n` +
                    `   • Subtotal: $${((i.precio_venta || i.price || 0) * i.quantity).toLocaleString()}` +
                    `${i.purchaseType === 'layaway' ? ' ⚠️ [APARTADO 50%]' : ''}`
                ).join('\n\n');

                const message = `🛒 *NUEVO PEDIDO - E-COMMERCE*\n\n` +
                    `${affiliateInfo}` +
                    `👤 *Cliente:* ${form.name}\n` +
                    `📞 *Teléfono:* ${form.phone}\n` +
                    `📍 *Dirección:* ${form.address}\n` +
                    `💳 *Método de Pago:* ${form.paymentMethod}\n` +
                    `${isLayawayOrder ? '⚠️ *Modalidad:* APARTADO CON ADELANTO (50%)\n' : ''}\n` +
                    `📦 *PRODUCTOS SELECCIONADOS:*\n${itemsText}\n\n` +
                    `──────────────────\n` +
                    `💰 *TOTAL A PAGAR: $${finalTotalToPay.toLocaleString()}*`;

                const whatsappUrl = `https://wa.me/573247356178?text=${encodeURIComponent(message)}`;
                window.open(whatsappUrl, '_blank');
            };

            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm animate-fadeIn">
                    <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto shadow-2xl flex flex-col">
                        <div className="flex justify-between items-center mb-4 pb-2 border-b">
                            <h2 className="font-bold text-base text-gray-900">🛒 Tu Carrito y Checkout</h2>
                            <button onClick={onClose} className="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center font-bold text-xs">✕</button>
                        </div>

                        {state.tamperedAlerts.length > 0 && (
                            <div className="bg-amber-50 border border-amber-200 text-amber-900 p-3 rounded-2xl text-xs mb-3 space-y-1">
                                {state.tamperedAlerts.map((alert, idx) => <p key={idx}>⚠️ {alert}</p>)}
                            </div>
                        )}

                        {state.cart.length === 0 ? (
                            <div className="text-center py-12 text-gray-400 text-xs">Tu carrito está vacío 🛍️</div>
                        ) : (
                            <div className="space-y-4">
                                <div className="divide-y max-h-52 overflow-y-auto pr-1">
                                    {state.cart.map((item, idx) => {
                                        const itemPrice = item.precio_venta || item.price || 0;
                                        return (
                                            <div key={idx} className="py-2.5 flex items-center justify-between gap-2 text-xs">
                                                <div className="flex items-center gap-2.5 min-w-0">
                                                    <img src={item.link_foto} alt={item.producto_Nombre} className="w-12 h-12 object-cover rounded-xl shrink-0 bg-gray-100" />
                                                    <div className="min-w-0">
                                                        <p className="font-bold text-gray-900 truncate">{item.producto_Nombre || item.name}</p>
                                                        <p className="text-[10px] text-gray-500">{JSON.stringify(item.options)}</p>
                                                        <p className="text-emerald-600 font-bold">${(itemPrice * item.quantity).toLocaleString()}</p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center border rounded-xl bg-gray-50 shrink-0">
                                                    <button onClick={() => dispatch({type: 'UPDATE_QUANTITY', payload: {index: idx, quantity: item.quantity - 1}})} className="px-2 py-1 text-gray-600">-</button>
                                                    <span className="px-2 font-bold">{item.quantity}</span>
                                                    <button onClick={() => dispatch({type: 'UPDATE_QUANTITY', payload: {index: idx, quantity: item.quantity + 1}})} className="px-2 py-1 text-gray-600">+</button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <button onClick={handleShareCart} className="w-full bg-emerald-50 text-emerald-700 border border-emerald-200 py-2 rounded-xl text-xs font-bold transition active:scale-95">
                                    🔗 Compartir Carrito (Afiliado / Amigos)
                                </button>

                                <form onSubmit={handleSubmitWhatsApp} className="space-y-3 pt-2 border-t">
                                    <h3 className="font-bold text-xs text-gray-700 uppercase tracking-wider">Datos de Envío (Guardados Automáticamente)</h3>
                                    <div>
                                        <label className="text-[11px] text-gray-500">Nombre Completo</label>
                                        <input required type="text" value={form.name} onChange={e=>handleFormChange('name', e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50 focus:bg-white transition" placeholder="Tu nombre" />
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-gray-500">Teléfono / WhatsApp</label>
                                        <input required type="tel" value={form.phone} onChange={e=>handleFormChange('phone', e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50 focus:bg-white transition" placeholder="3001234567" />
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-gray-500">Dirección de Entrega</label>
                                        <input required type="text" value={form.address} onChange={e=>handleFormChange('address', e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50 focus:bg-white transition" placeholder="Calle 123 # 45-67" />
                                    </div>
                                    <div>
                                        <label className="text-[11px] text-gray-500">Método de Pago</label>
                                        <select value={form.paymentMethod} onChange={e=>handleFormChange('paymentMethod', e.target.value)} className="w-full p-2.5 border rounded-xl text-xs bg-gray-50">
                                            <option value="Nequi">Nequi (3247356178)</option>
                                            <option value="Daviplata">Daviplata</option>
                                            <option value="Contra Entrega">Pago Contra Entrega</option>
                                        </select>
                                    </div>

                                    <div className="bg-gray-50 p-3 rounded-2xl text-xs space-y-1.5 border border-gray-100">
                                        <div className="flex justify-between text-gray-600"><span>Subtotal:</span><span>${total.toLocaleString()}</span></div>
                                        {isLayawayOrder && <div className="flex justify-between text-emerald-600 font-medium"><span>Adelanto Requerido (50%):</span><span>${finalTotalToPay.toLocaleString()}</span></div>}
                                        <div className="flex justify-between font-extrabold text-sm pt-1.5 border-t text-black"><span>Total a Gestionar:</span><span>${finalTotalToPay.toLocaleString()}</span></div>
                                    </div>

                                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-2xl font-extrabold text-sm shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
                                        <span>Enviar Pedido por WhatsApp</span> 🚀
                                    </button>
                                </form>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- 8. APLICACIÓN PRINCIPAL ---
        function App() {
            const { state, dispatch } = useCart();
            const [selectedCategory, setSelectedCategory] = useState('todos');
            const [searchTerm, setSearchTerm] = useState('');
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);
            const [selectedProduct, setSelectedProduct] = useState(null);

            // Extraer categorías únicas dinámicamente del JSON
            const categories = ['todos', ...new Set(state.products.map(p => p['Tipo de producto']).filter(Boolean))];

            // Buscador inteligente multivariable (barrido por nombre, detalles, tipo, seo y colores)
            const filteredProducts = state.products.filter(p => {
                const type = p['Tipo de producto'] || '';
                const matchesCategory = selectedCategory === 'todos' || type === selectedCategory;

                const searchLower = searchTerm.toLowerCase().trim();
                if (!searchLower) return matchesCategory;

                const nameMatch = (p.producto_Nombre || '').toLowerCase().includes(searchLower);
                const detailsMatch = (p['Detalles del producto ( opcional )'] || '').toLowerCase().includes(searchLower);
                const typeMatch = type.toLowerCase().includes(searchLower);
                const seoMatch = (p.seo || '').toLowerCase().includes(searchLower);
                const colorMatch = (p.colores || '').toLowerCase().includes(searchLower);

                return matchesCategory && (nameMatch || detailsMatch || typeMatch || seoMatch || colorMatch);
            });

            const totalCartItems = state.cart.reduce((acc, item) => acc + item.quantity, 0);

            const handleAddToCartFromDetail = (product, options, isLayaway) => {
                dispatch({
                    type: 'ADD_TO_CART',
                    payload: {
                        product,
                        quantity: 1,
                        options,
                        purchaseType: isLayaway ? 'layaway' : 'full'
                    }
                });
                alert(`¡${product.producto_Nombre} añadido al carrito!`);
            };

            return (
                <div className="min-h-screen pb-24">
                    {/* Header Principal */}
                    <header className="sticky top-0 bg-white/95 backdrop-blur-md z-40 border-b border-gray-100 px-4 py-3 shadow-xs">
                        <div className="max-w-xl mx-auto flex items-center justify-between gap-3">
                            <button 
                                onClick={() => setIsDrawerOpen(true)}
                                className="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center font-bold text-sm active:scale-95 transition"
                            >
                                ☰
                            </button>
                            <h1 className="font-black text-xs sm:text-sm tracking-tight text-gray-900">E-COMMERCE MÓVIL</h1>
                            <button
                                onClick={() => setIsCartOpen(true)}
                                className="relative bg-black text-white px-3.5 py-2 rounded-full text-xs font-bold flex items-center gap-1 active:scale-95 transition shadow-sm"
                            >
                                🛒 {totalCartItems > 0 && <span className="bg-emerald-500 text-white rounded-full px-1.5 py-0.2 text-[10px]">{totalCartItems}</span>}
                            </button>
                        </div>
                        {/* Buscador inteligente */}
                        <div className="max-w-xl mx-auto mt-2.5">
                            <input
                                type="text"
                                placeholder="🔍 Buscar por nombre, detalles, SEO o colores..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="w-full bg-gray-100 border border-transparent focus:border-black rounded-2xl px-4 py-2 text-xs outline-none transition shadow-inner"
                            />
                        </div>
                    </header>

                    {/* Categorías deslizables */}
                    <nav className="max-w-xl mx-auto px-4 py-3 overflow-x-auto flex gap-2 no-scrollbar">
                        {categories.map(cat => (
                            <button
                                key={cat}
                                onClick={() => setSelectedCategory(cat)}
                                className={`whitespace-nowrap px-4 py-2 rounded-full text-xs font-bold transition shadow-xs ${selectedCategory === cat ? 'bg-black text-white' : 'bg-white border border-gray-200 text-gray-600'}`}
                            >
                                {cat === 'todos' ? '🔥 Todos' : cat}
                            </button>
                        ))}
                    </nav>

                    {/* Contenido / Grid de Productos (Adaptado a 2 columnas para celular) */}
                    <main className="max-w-xl mx-auto px-4 py-1">
                        {state.loadingProducts ? (
                            <div className="text-center py-20 text-gray-400 text-xs animate-pulse">Cargando catálogo inteligente...</div>
                        ) : (
                            <div className="grid grid-cols-2 gap-3">
                                {filteredProducts.map(product => (
                                    <ProductCard 
                                        key={product.id} 
                                        product={product} 
                                        onSelect={(p) => setSelectedProduct(p)} 
                                    />
                                ))}
                            </div>
                        )}
                        {!state.loadingProducts && filteredProducts.length === 0 && (
                            <div className="text-center py-20 text-gray-400 text-xs">No se encontraron productos con tu búsqueda.</div>
                        )}
                    </main>

                    {/* Modales y Drawers */}
                    <ProductDetailModal 
                        product={selectedProduct} 
                        onClose={() => setSelectedProduct(null)} 
                        onAddToCart={handleAddToCartFromDetail} 
                    />
                    <CartCheckoutModal isOpen={isCartOpen} onClose={() => setIsCartOpen(false)} />
                    <AppDrawer 
                        isOpen={isDrawerOpen} 
                        onClose={() => setIsDrawerOpen(false)} 
                        products={state.products} 
                        onSelectProduct={(p) => setSelectedProduct(p)} 
                    />
                </div>
            );
        }

        // Renderizar Aplicación en el DOM
        ReactDOM.render(
            <CartProvider>
                <App />
            </CartProvider>,
            document.getElementById('root')
        );
    </script>
</body>
</html>
