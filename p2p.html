<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC P2P Conexión Directa</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 15px; margin: 0; }
    .box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    #status { color: #00bcd4; font-weight: bold; margin-bottom: 10px; }
    #chat-box { height: 150px; background: #000; border: 1px solid #333; padding: 10px; overflow-y: auto; margin-bottom: 10px; }
    input, button { padding: 10px; font-size: 14px; border-radius: 5px; border: none; }
    input[type="text"] { background: #2a2a2a; color: #fff; width: calc(100% - 100px); }
    button { background: #007acc; color: #fff; font-weight: bold; cursor: pointer; }
    button:disabled { background: #444; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>Conexión WebRTC P2P</h2>
  
  <div class="box">
    <div id="status">Estado: Selecciona un rol para empezar</div>
    <div id="room-info" style="margin-bottom: 10px;"></div>
    
    <button id="btn-host" onclick="startAsHost()">1. Crear Sala (Host)</button>
    <div style="margin-top: 10px;">
      <input type="text" id="input-room" placeholder="Código de sala (ej: 4821)">
      <button id="btn-guest" onclick="startAsGuest()">2. Unirse (Invitado)</button>
    </div>
  </div>

  <div class="box">
    <div id="chat-box"></div>
    <div style="display: flex; gap: 5px;">
      <input type="text" id="msgInput" placeholder="Escribe un mensaje..." disabled>
      <button id="sendBtn" onclick="sendMsg()" disabled>Enviar</button>
    </div>
  </div>

<script>
  // REEMPLAZA ESTA URL CON TU URL DE GOOGLE APPS SCRIPT
  const GAS_URL = "TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI"; 

  const rtcConfig = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]
  };

  let pc = new RTCPeerConnection(rtcConfig);
  let dataChannel = null;
  let roomId = null;

  function updateStatus(txt) {
    document.getElementById('status').innerText = "Estado: " + txt;
  }

  // FUNCIÓN CLAVE: Espera a que WebRTC encuentre todas las IPs (ICE Candidates)
  function waitForIceGathering(peerConnection) {
    return new Promise((resolve) => {
      if (peerConnection.iceGatheringState === 'complete') {
        resolve();
      } else {
        function checkState() {
          if (peerConnection.iceGatheringState === 'complete') {
            peerConnection.removeEventListener('icegatheringstatechange', checkState);
            resolve();
          }
        }
        peerConnection.addEventListener('icegatheringstatechange', checkState);
      }
    });
  }

  // --- ROL: HOST (CREAR SALA) ---
  async function startAsHost() {
    disableControls();
    roomId = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('room-info').innerHTML = `<b>Código de tu sala: <span style="color:#00ff00; font-size: 1.2em;">${roomId}</span></b> (Comparte este número)`;
    
    updateStatus("Creando oferta y buscando IPs públicas...");

    dataChannel = pc.createDataChannel("chat");
    bindDataChannelEvents(dataChannel);

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    // Esperar a tener la dirección IP pública completa en el SDP
    await waitForIceGathering(pc);

    updateStatus("Guardando oferta completa en Google Apps Script...");
    await sendSignal('offer', pc.localDescription);

    updateStatus("Esperando a que el invitado se una...");
    pollSignal('answer', async (answer) => {
      updateStatus("Respuesta recibida. Estableciendo túnel P2P...");
      await pc.setRemoteDescription(new RTCSessionDescription(answer));
    });
  }

  // --- ROL: INVITADO (UNIRSE A SALA) ---
  async function startAsGuest() {
    const input = document.getElementById('input-room').value.trim();
    if (!input) return alert("Escribe el código de la sala");
    
    roomId = input;
    disableControls();

    pc.ondatachannel = (evt) => {
      dataChannel = evt.channel;
      bindDataChannelEvents(dataChannel);
    };

    updateStatus("Buscando la oferta del Host en Apps Script...");
    
    pollSignal('offer', async (offer) => {
      updateStatus("Oferta encontrada. Generando respuesta e IPs...");
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      // Esperar a recopilar las IPs antes de enviar
      await waitForIceGathering(pc);

      updateStatus("Enviando respuesta a Apps Script...");
      await sendSignal('answer', pc.localDescription);
      updateStatus("Conectando con el Host...");
    });
  }

  function bindDataChannelEvents(channel) {
    channel.onopen = () => {
      updateStatus("¡CONECTADO DIRECTAMENTE (P2P)!");
      document.getElementById('msgInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
    };
    channel.onmessage = (e) => appendMsg("Remoto", e.data);
    channel.onclose = () => updateStatus("Conexión cerrada");
  }

  function sendMsg() {
    const input = document.getElementById('msgInput');
    if (input.value.trim() && dataChannel && dataChannel.readyState === "open") {
      dataChannel.send(input.value);
      appendMsg("Yo", input.value);
      input.value = "";
    }
  }

  function appendMsg(sender, text) {
    const box = document.getElementById('chat-box');
    box.innerHTML += `<div><b>${sender}:</b> ${text}</div>`;
    box.scrollTop = box.scrollHeight;
  }

  function disableControls() {
    document.getElementById('btn-host').disabled = true;
    document.getElementById('btn-guest').disabled = true;
    document.getElementById('input-room').disabled = true;
  }

  // --- Peticiones HTTP a Apps Script ---
  async function sendSignal(type, signalData) {
    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'cors',
      body: JSON.stringify({ action: 'sendSignal', roomId: roomId, type: type, signal: signalData })
    });
  }

  function pollSignal(type, callback) {
    const interval = setInterval(async () => {
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          mode: 'cors',
          body: JSON.stringify({ action: 'getSignal', roomId: roomId, type: type })
        });
        const data = await res.json();
        if (data.signal) {
          clearInterval(interval);
          callback(data.signal);
        }
      } catch (e) {
        console.error("Error consultando señal:", e);
      }
    }, 2500);
  }
</script>
</body>
</html>
