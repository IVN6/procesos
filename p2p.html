<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC P2P Resiliente</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    video { width: 100%; background: #222; border-radius: 8px; transform: scaleX(-1); }
    #chat-box { height: 180px; border: 1px solid #333; border-radius: 8px; overflow-y: auto; padding: 10px; background: #1a1a1a; margin-bottom: 10px; }
    .msg { margin-bottom: 5px; word-break: break-all; }
    .status { font-size: 0.85em; color: #888; margin-bottom: 10px; }
    input, button { padding: 10px; border-radius: 6px; border: none; font-size: 14px; }
    input[type="text"] { background: #2a2a2a; color: #fff; width: calc(100% - 90px); }
    button { background: #007acc; color: #fff; font-weight: bold; cursor: pointer; }
    button:disabled { background: #444; }
  </style>
</head>
<body>

  <h2>WebRTC P2P Room</h2>
  <div class="status" id="status">Estado: Desconectado</div>

  <div class="video-grid">
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <div id="chat-box"></div>

  <div style="display: flex; gap: 5px;">
    <input type="text" id="msgInput" placeholder="Escribe un mensaje..." disabled>
    <button id="sendBtn" onclick="sendMsg()" disabled>Enviar</button>
  </div>

  <br>
  <button onclick="toggleMedia('video')">Cam On/Off</button>
  <button onclick="toggleMedia('audio')">Mic On/Off</button>

<script>
  // REEMPLAZA ESTA URL CON TU DESPLIEGUE DE GOOGLE APPS SCRIPT
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwF3WTRVnPXfqjYm7Q8aExdvGNyK3SBNhvq-oZl2wjirSKZ6UtdprgZM1Vvz52nBTgj/exec"; 
  
  // Configuración con servidores STUN gratuitos de Google
  const rtcConfig = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]
  };

  let pc = new RTCPeerConnection(rtcConfig);
  let dataChannel = null;
  let localStream = null;
  
  // Persistencia de la sala
  // --- CÓDIGO CORREGIDO ---
const urlParams = new URLSearchParams(window.location.search);
let roomId = urlParams.get('room'); // Permite entrar directo con un link tipo ?room=sala-8919

const role = localStorage.getItem('wbtc_role') || (confirm("¿Crear la conexión como Anfitrión?") ? 'host' : 'guest');
localStorage.setItem('wbtc_role', role);

if (!roomId) {
  if (role === 'host') {
    // El host genera un ID aleatorio si no viene en la URL
    roomId = localStorage.getItem('wbtc_room') || 'sala-' + Math.floor(Math.random() * 8999 + 1000);
  } else {
    // El invitado introduce la sala que le dio el Host
    roomId = prompt("Ingresa el ID de la sala del Anfitrión (ej: sala-8919):");
  }
}

localStorage.setItem('wbtc_room', roomId);
 
  const statusEl = document.getElementById('status');
  statusEl.innerText = `Estado: Sala [${roomId}] - Esperando pares...`;

  async function init() {
    setupDataChannelHandlers();
    await setupMedia();

    // Eventos de estado de red
    pc.oniceconnectionstatechange = () => {
      statusEl.innerText = `Red: ${pc.iceConnectionState}`;
    };

    // Recibir streaming de audio/video
    pc.ontrack = (evt) => {
      document.getElementById('remoteVideo').srcObject = evt.streams[0];
    };

    // Auto-coordinación por roles
    const role = localStorage.getItem('wbtc_role') || (confirm("¿Crear la conexión como Anfitrión?") ? 'host' : 'guest');
    localStorage.setItem('wbtc_role', role);

    if (role === 'host') {
      dataChannel = pc.createDataChannel("chat");
      bindChannelEvents(dataChannel);
      
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await sendSignal('offer', offer);
      
      // Esperar respuesta del Invitado
      pollSignal('answer', async (answer) => {
        if (pc.signalingState !== "stable") {
          await pc.setRemoteDescription(new RTCSessionDescription(answer));
        }
      });
    } else {
      pc.ondatachannel = (evt) => {
        dataChannel = evt.channel;
        bindChannelEvents(dataChannel);
      };
      
      // Esperar oferta del Anfitrión
      pollSignal('offer', async (offer) => {
        if (pc.signalingState === "stable") return;
        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await sendSignal('answer', answer);
      });
    }
  }

  // Captura multimedia tolerante a fallos de permisos
  async function setupMedia() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById('localVideo').srcObject = localStream;
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    } catch (err) {
      console.warn("Permisos de cámara/micrófono denegados o no disponibles. El chat seguirá funcionando.", err);
    }
  }

  function setupDataChannelHandlers() {
    // Escuchar cuando el canal de datos esté listo
  }

  function bindChannelEvents(channel) {
    channel.onopen = () => {
      statusEl.innerText = `¡Conectado directamente a la P2P!`;
      document.getElementById('msgInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
    };
    channel.onmessage = (e) => appendMsg("Remoto", e.data);
  }

  function sendMsg() {
    const input = document.getElementById('msgInput');
    if (input.value.trim() && dataChannel && dataChannel.readyState === "open") {
      dataChannel.send(input.value);
      appendMsg("Yo", input.value);
      input.value = "";
    }
  }

  function appendMsg(sender, text) {
    const box = document.getElementById('chat-box');
    box.innerHTML += `<div class="msg"><b>${sender}:</b> ${text}</div>`;
    box.scrollTop = box.scrollHeight;
  }

  function toggleMedia(type) {
    if (!localStream) return;
    const tracks = type === 'video' ? localStream.getVideoTracks() : localStream.getAudioTracks();
    tracks.forEach(t => t.enabled = !t.enabled);
  }

  // Comunicación con Google Apps Script
  async function sendSignal(type, signal) {
    await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'sendSignal', roomId: roomId, type: type, signal: signal })
    });
  }

  function pollSignal(type, callback) {
    const interval = setInterval(async () => {
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getSignal', roomId: roomId, type: type })
        });
        const data = await res.json();
        if (data.signal) {
          clearInterval(interval);
          callback(data.signal);
        }
      } catch (e) { console.error("Error al consultar señalización", e); }
    }, 2000);
  }

  window.onload = init;
</script>
</body>
</html>
