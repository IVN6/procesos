<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Malla Multiusuario</title>
  <style>
    body { font-family: monospace; background: #0d1117; color: #c9d1d9; padding: 15px; margin: 0; }
    h2 { color: #58a6ff; margin-top: 0; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 15px; margin-bottom: 15px; }
    .btn { background: #238636; color: #fff; border: none; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 3px; }
    .btn:disabled { background: #343942; color: #8b949e; cursor: not-allowed; }
    .btn-room { background: #1f6beb; }
    #console { background: #000; color: #39ff14; font-family: monospace; height: 150px; overflow-y: auto; padding: 10px; border-radius: 6px; border: 1px solid #30363d; font-size: 11px; }
    #chat-box { height: 150px; background: #0d1117; border: 1px solid #30363d; overflow-y: auto; padding: 8px; margin-bottom: 10px; border-radius: 4px; }
    input[type="text"] { background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 8px; border-radius: 4px; width: calc(100% - 100px); }
    img.chat-img { max-width: 100%; border-radius: 6px; margin-top: 5px; }
    .peer-badge { display: inline-block; background: #1f6beb; color: #fff; padding: 3px 8px; border-radius: 12px; font-size: 11px; margin: 2px; }
  </style>
</head>
<body>

  <h2>WebRTC Mesh (Grupal Multiusuario)</h2>

  <div id="audio-container"></div>

  <div class="card">
    <div id="rooms-list">Consultando salas en Apps Script...</div>
    <button class="btn" onclick="createNewRoom()">+ Crear Nueva Sala Grupal</button>
    <button class="btn" style="background:#484f58" onclick="checkRooms()">Refrescar</button>
    <div style="margin-top:10px;">
      <b>Conectados en esta sala:</b> <span id="peers-count">0</span>
      <div id="peers-list"></div>
    </div>
  </div>

  <div class="card">
    <b>Terminal / Registrador de Eventos:</b>
    <div id="console"></div>
  </div>

  <div class="card">
    <b>Chat Grupal P2P y Archivos:</b>
    <div id="chat-box"></div>
    <div style="display:flex; gap:5px; margin-bottom:8px;">
      <input type="text" id="msgInput" placeholder="Mensaje a todos..." disabled>
      <button class="btn" id="sendBtn" onclick="broadcastMsg()" disabled>Enviar</button>
    </div>
    <div>
      <input type="file" id="fileInput" disabled style="font-size:12px;">
      <button class="btn btn-room" id="fileBtn" onclick="broadcastFile()" disabled>Enviar Archivo</button>
    </div>
  </div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwF3WTRVnPXfqjYm7Q8aExdvGNyK3SBNhvq-oZl2wjirSKZ6UtdprgZM1Vvz52nBTgj/exec";

  const rtcConfig = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]
  };

  // Identificador único de este navegador
  const myPeerId = "user_" + Math.floor(Math.random() * 899999 + 100000);
  let currentRoomId = null;
  
  // Mapa de conexiones activas: { targetPeerId: { pc, dataChannel } }
  const peersMap = {};
  let localAudioStream = null;

  function log(msg, detail = null) {
    const consoleEl = document.getElementById('console');
    const time = new Date().toLocaleTimeString();
    let text = `[${time}] ${msg}`;
    if (detail) text += `\n  ↳ ${typeof detail === 'object' ? JSON.stringify(detail).substring(0, 100) : detail}`;
    consoleEl.innerHTML += text + '<br>';
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  async function callGAS(payload) {
    try {
      const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
      return await res.json();
    } catch (err) {
      log(`Error HTTP:`, err.toString());
      return null;
    }
  }

  function waitForICE(pc) {
    return new Promise((resolve) => {
      if (pc.iceGatheringState === 'complete') return resolve();
      const timer = setTimeout(() => resolve(), 3000);
      pc.onicegatheringstatechange = () => {
        if (pc.iceGatheringState === 'complete') {
          clearTimeout(timer);
          resolve();
        }
      };
    });
  }

  // Inicializar audio local
  async function initAudio() {
    if (!localAudioStream) {
      try {
        localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        log("Micrófono listo para transmisiones P2P.");
      } catch (e) {
        log("Aviso: Sin acceso a micrófono. Funcionarás solo con Chat y Archivos.");
      }
    }
  }

  async function checkRooms() {
    const res = await callGAS({ action: 'listRooms' });
    const listEl = document.getElementById('rooms-list');
    if (res && res.rooms && res.rooms.length > 0) {
      listEl.innerHTML = '<b>Salas disponibles:</b> ';
      res.rooms.forEach(id => {
        listEl.innerHTML += `<button class="btn btn-room" onclick="enterRoom('${id}')">Entrar a Sala #${id}</button> `;
      });
    } else {
      listEl.innerHTML = '<i>No hay salas creadas. Crea una nueva.</i>';
    }
  }

  function createNewRoom() {
    const newId = Math.floor(1000 + Math.random() * 9000).toString();
    enterRoom(newId);
  }

  // Entrar a una sala (se conecta a TODOS los usuarios presentes)
  async function enterRoom(roomId) {
    currentRoomId = roomId;
    log(`Uniéndose a la sala grupal #${currentRoomId} con ID de usuario: ${myPeerId}`);
    await initAudio();

    // Registrarme y obtener la lista de usuarios ya conectados
    const res = await callGAS({ action: 'joinRoom', roomId: currentRoomId, peerId: myPeerId });
    const existingPeers = res ? res.peers : [];
    
    log(`Usuarios existentes en la sala: ${existingPeers.length}`, existingPeers);

    // 1. Iniciar conexión P2P hacia cada usuario que ya estaba antes
    existingPeers.forEach(targetId => initiateConnection(targetId));

    // 2. Iniciar polling para escuchar ofertas/respuestas de usuarios que entren después
    startSignalPolling();
  }

  // Crear oferta para un usuario en específico
  async function initiateConnection(targetPeerId) {
    log(`Iniciando túnel P2P hacia ${targetPeerId}...`);
    const pc = new RTCPeerConnection(rtcConfig);
    
    if (localAudioStream) {
      localAudioStream.getTracks().forEach(t => pc.addTrack(t, localAudioStream));
    }

    pc.ontrack = (evt) => attachRemoteAudio(targetPeerId, evt.streams[0]);

    const dc = pc.createDataChannel("chat");
    bindChannelEvents(dc, targetPeerId);

    peersMap[targetPeerId] = { pc: pc, dataChannel: dc };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitForICE(pc);

    await callGAS({
      action: 'sendSignal',
      roomId: currentRoomId,
      fromPeerId: myPeerId,
      toPeerId: targetPeerId,
      signal: pc.localDescription
    });
  }

  // Escuchar mensajes entrantes en la pizarra
  function startSignalPolling() {
    setInterval(async () => {
      if (!currentRoomId) return;
      const res = await callGAS({ action: 'getSignals', roomId: currentRoomId, myPeerId: myPeerId });
      
      if (res && res.signals && res.signals.length > 0) {
        for (let item of res.signals) {
          await handleIncomingSignal(item.fromPeerId, item.signal);
        }
      }
    }, 3000);
  }

  // Procesar Oferta o Respuesta recibida
  async function handleIncomingSignal(senderId, signal) {
    log(`Señal entrante tipo [${signal.type}] recibida de ${senderId}`);

    if (signal.type === 'offer') {
      const pc = new RTCPeerConnection(rtcConfig);
      
      if (localAudioStream) {
        localAudioStream.getTracks().forEach(t => pc.addTrack(t, localAudioStream));
      }

      pc.ontrack = (evt) => attachRemoteAudio(senderId, evt.streams[0]);

      pc.ondatachannel = (evt) => {
        bindChannelEvents(evt.channel, senderId);
        peersMap[senderId].dataChannel = evt.channel;
      };

      peersMap[senderId] = { pc: pc, dataChannel: null };

      await pc.setRemoteDescription(new RTCSessionDescription(signal));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await waitForICE(pc);

      await callGAS({
        action: 'sendSignal',
        roomId: currentRoomId,
        fromPeerId: myPeerId,
        toPeerId: senderId,
        signal: pc.localDescription
      });

    } else if (signal.type === 'answer') {
      if (peersMap[senderId] && peersMap[senderId].pc) {
        await peersMap[senderId].pc.setRemoteDescription(new RTCSessionDescription(signal));
      }
    }
  }

  function bindChannelEvents(channel, peerId) {
    channel.onopen = () => {
      log(`¡¡TÚNEL P2P CONECTADO CON ${peerId}!!`);
      updatePeersUI();
    };
    channel.onmessage = (e) => handleIncomingMessage(peerId, e.data);
    channel.onclose = () => {
      log(`Conexión cerrada con ${peerId}`);
      delete peersMap[peerId];
      updatePeersUI();
    };
  }

  function attachRemoteAudio(peerId, stream) {
    let audioEl = document.getElementById("audio_" + peerId);
    if (!audioEl) {
      audioEl = document.createElement("audio");
      audioEl.id = "audio_" + peerId;
      audioEl.autoplay = true;
      document.getElementById("audio-container").appendChild(audioEl);
    }
    audioEl.srcObject = stream;
  }

  function updatePeersUI() {
    const activePeers = Object.keys(peersMap).filter(id => peersMap[id].dataChannel && peersMap[id].dataChannel.readyState === 'open');
    document.getElementById('peers-count').innerText = activePeers.length;
    const listEl = document.getElementById('peers-list');
    listEl.innerHTML = activePeers.map(id => `<span class="peer-badge">${id}</span>`).join(' ');

    const hasConnections = activePeers.length > 0;
    document.getElementById('msgInput').disabled = !hasConnections;
    document.getElementById('sendBtn').disabled = !hasConnections;
    document.getElementById('fileInput').disabled = !hasConnections;
    document.getElementById('fileBtn').disabled = !hasConnections;
  }

  // Enviar mensaje a TODOS los usuarios conectados en la malla
  function broadcastMsg() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    const payload = JSON.stringify({ type: 'text', content: text });
    
    Object.keys(peersMap).forEach(peerId => {
      const dc = peersMap[peerId].dataChannel;
      if (dc && dc.readyState === 'open') dc.send(payload);
    });

    appendMsg("Yo (Todos)", text);
    input.value = "";
  }

  // Enviar archivo a TODOS en la malla
  function broadcastFile() {
    const fileEl = document.getElementById('fileInput');
    const file = fileEl.files[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) return alert("Máximo 3 MB por archivo.");

    const reader = new FileReader();
    reader.onload = (evt) => {
      const payload = JSON.stringify({
        type: 'file',
        fileName: file.name,
        fileType: file.type,
        data: evt.target.result
      });

      Object.keys(peersMap).forEach(peerId => {
        const dc = peersMap[peerId].dataChannel;
        if (dc && dc.readyState === 'open') dc.send(payload);
      });

      appendMsg("Yo (Archivo)", file.name, file.type, evt.target.result);
      fileEl.value = "";
    };
    reader.readAsDataURL(file);
  }

  function handleIncomingMessage(senderId, raw) {
    try {
      const parsed = JSON.parse(raw);
      if (parsed.type === 'text') {
        appendMsg(senderId, parsed.content);
      } else if (parsed.type === 'file') {
        appendMsg(`${senderId} (Archivo)`, parsed.fileName, parsed.fileType, parsed.data);
      }
    } catch(e) {
      appendMsg(senderId, raw);
    }
  }

  function appendMsg(sender, text, mimeType = null, dataUrl = null) {
    const box = document.getElementById('chat-box');
    let content = `<div><b>${sender}:</b> ${text}</div>`;
    if (dataUrl) {
      if (mimeType && mimeType.startsWith('image/')) {
        content += `<img src="${dataUrl}" class="chat-img"><br>`;
      } else {
        content += `<a href="${dataUrl}" download="${text}" style="color:#58a6ff">Descargar Archivo</a><br>`;
      }
    }
    box.innerHTML += content;
    box.scrollTop = box.scrollHeight;
  }

  window.onload = checkRooms;
</script>
</body>
</html>
