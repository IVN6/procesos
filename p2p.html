<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Auto-Discover P2P</title>
  <style>
    body { font-family: monospace; background: #0d1117; color: #c9d1d9; padding: 15px; margin: 0; }
    h2 { color: #58a6ff; margin-top: 0; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 15px; margin-bottom: 15px; }
    .btn { background: #238636; color: #fff; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px 2px; }
    .btn:disabled { background: #343942; color: #8b949e; cursor: not-allowed; }
    .btn-room { background: #1f6beb; }
    #console { background: #000; color: #39ff14; font-family: 'Courier New', monospace; height: 180px; overflow-y: auto; padding: 10px; border-radius: 6px; border: 1px solid #30363d; font-size: 12px; }
    #chat-box { height: 120px; background: #0d1117; border: 1px solid #30363d; overflow-y: auto; padding: 8px; margin-bottom: 10px; border-radius: 4px; }
    input[type="text"] { background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 8px; border-radius: 4px; width: calc(100% - 90px); }
  </style>
</head>
<body>

  <h2>WebRTC Monitor & Terminal P2P</h2>

  <div class="card">
    <div id="rooms-section">
      <b>Salas activas en red:</b>
      <div id="rooms-list" style="margin: 10px 0;">Buscando salas en Google Apps Script...</div>
      <button class="btn" id="btn-create" onclick="createRoom()">+ Crear Nueva Sala (Host)</button>
      <button class="btn" style="background:#484f58" onclick="checkRooms()">Refrescar Salas</button>
    </div>
  </div>

  <div class="card">
    <b>Registro de Eventos / Terminal (Logs):</b>
    <div id="console"></div>
  </div>

  <div class="card">
    <b>Chat P2P Directo:</b>
    <div id="chat-box"></div>
    <div style="display:flex; gap:5px;">
      <input type="text" id="msgInput" placeholder="Mensaje..." disabled>
      <button class="btn" id="sendBtn" onclick="sendMsg()" disabled>Enviar</button>
    </div>
  </div>

<script>
  // URL de tu Google Apps Script
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwF3WTRVnPXfqjYm7Q8aExdvGNyK3SBNhvq-oZl2wjirSKZ6UtdprgZM1Vvz52nBTgj/exec";

  const rtcConfig = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]
  };

  let pc = new RTCPeerConnection(rtcConfig);
  let dataChannel = null;
  let currentRoomId = null;

  function log(msg, detail = null) {
    const consoleEl = document.getElementById('console');
    const time = new Date().toLocaleTimeString();
    let text = `[${time}] ${msg}`;
    if (detail) {
      text += `\n  ↳ ${typeof detail === 'object' ? JSON.stringify(detail).substring(0, 120) + '...' : detail}`;
    }
    consoleEl.innerHTML += text + '<br>';
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  // Petición HTTP optimizada para evitar bloqueo CORS de Google
  async function callGAS(payload) {
    log(`HTTP POST -> GAS (${payload.action})`);
    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload) // Sin cabeceras de Content-Type personalizadas
      });
      const data = await res.json();
      log(`HTTP <- GAS (${payload.action}) Respuesta:`, data);
      return data;
    } catch (err) {
      log(`ERROR HTTP en ${payload.action}:`, err.toString());
      return null;
    }
  }

  // Recolectar direcciones IP (ICE Candidates)
  function waitForICE() {
    return new Promise((resolve) => {
      if (pc.iceGatheringState === 'complete') return resolve();
      
      const timer = setTimeout(() => {
        log("Timeout STUN (3s). Continuando con candidatos recopilados.");
        resolve();
      }, 3500);

      pc.onicegatheringstatechange = () => {
        log(`Estado recolección red STUN: ${pc.iceGatheringState}`);
        if (pc.iceGatheringState === 'complete') {
          clearTimeout(timer);
          resolve();
        }
      };
    });
  }

  // Buscar salas al iniciar
  async function checkRooms() {
    log("Consultando salas disponibles...");
    const res = await callGAS({ action: 'listRooms' });
    const listEl = document.getElementById('rooms-list');
    
    if (res && res.rooms && res.rooms.length > 0) {
      listEl.innerHTML = '';
      res.rooms.forEach(id => {
        listEl.innerHTML += `<button class="btn btn-room" onclick="joinRoom('${id}')">Unirse a Sala #${id}</button> `;
      });
    } else {
      listEl.innerHTML = '<i>No hay salas activas. Sé el primero en crear una.</i>';
    }
  }

  // ROL 1: Crear Sala (Host)
  async function createRoom() {
    document.getElementById('btn-create').disabled = true;
    currentRoomId = Math.floor(1000 + Math.random() * 9000).toString();
    log(`Iniciando creación de Sala #${currentRoomId} como HOST...`);

    dataChannel = pc.createDataChannel("chat");
    bindChannelEvents(dataChannel);

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    log("Esperando servidores STUN de Google...");
    await waitForICE();

    log("Enviando Oferta SDP completa a GAS...");
    await callGAS({ action: 'createRoom', roomId: currentRoomId, offer: pc.localDescription });

    log("Oferta guardada. Esperando que un invitado se una...");
    
    // Polling esperando la Respuesta
    const poll = setInterval(async () => {
      const res = await callGAS({ action: 'getAnswer', roomId: currentRoomId });
      if (res && res.answer) {
        clearInterval(poll);
        log("¡Respuesta SDP detectada! Estableciendo conexión final...");
        await pc.setRemoteDescription(new RTCSessionDescription(res.answer));
      }
    }, 4000);
  }

  // ROL 2: Unirse a Sala (Invitado)
  async function joinRoom(roomId) {
    currentRoomId = roomId;
    log(`Intentando unirse a la Sala #${currentRoomId} como INVITADO...`);

    pc.ondatachannel = (evt) => {
      dataChannel = evt.channel;
      bindChannelEvents(dataChannel);
    };

    const res = await callGAS({ action: 'getOffer', roomId: currentRoomId });
    if (!res || !res.offer) {
      return log("Error: La oferta de esa sala no existe o expiró.");
    }

    log("Oferta SDP del Host obtenida. Configurando remoto...", res.offer.type);
    await pc.setRemoteDescription(new RTCSessionDescription(res.offer));

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    log("Recolectando IPs para la Respuesta...");
    await waitForICE();

    log("Enviando Respuesta SDP a GAS...");
    await callGAS({ action: 'sendAnswer', roomId: currentRoomId, answer: pc.localDescription });
    log("Respuesta enviada. Esperando túnel P2P...");
  }

  function bindChannelEvents(channel) {
    channel.onopen = () => {
      log("¡¡TÚNEL P2P ESTABLECIDO CON ÉXITO!!");
      document.getElementById('msgInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
    };
    channel.onmessage = (e) => appendMsg("Remoto", e.data);
    channel.onclose = () => log("Canal P2P Cerrado");
  }

  function sendMsg() {
    const input = document.getElementById('msgInput');
    if (input.value.trim() && dataChannel && dataChannel.readyState === "open") {
      dataChannel.send(input.value);
      appendMsg("Yo", input.value);
      input.value = "";
    }
  }

  function appendMsg(sender, text) {
    const box = document.getElementById('chat-box');
    box.innerHTML += `<div><b>${sender}:</b> ${text}</div>`;
    box.scrollTop = box.scrollHeight;
  }

  window.onload = checkRooms;
</script>
</body>
</html>
