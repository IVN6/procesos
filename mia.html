<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="manifest.json">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organízate Ya - Procesos</title>
    <!-- Preparado para PWA -->
    <link rel="icon" sizes="192x192" href="icon.png">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <!-- CABECERA PRINCIPAL -->
    <header class="app-header">
        <h1>La incompetencia da Asco <span id="header-subtitle"></span></h1>
        
        <!-- Navegación Principal -->
        <nav class="main-nav">
            <button data-route="home">🏠 Inicio</button>
            <button data-route="editor">✏️ Editar Procesos</button>
            <button data-route="messages">💬 Mensajes</button>
            <button data-route="settings">⚙️ Ajustes</button>
        </nav>
    </header>

    <!-- CONTENEDOR DINÁMICO (Aquí JS inyectará las vistas) -->
    <main id="app-root"></main>

    <!-- ========================================== -->
    <!-- PLANTILLAS (No se ven hasta que JS las usa) -->
    <!-- ========================================== -->

    <!-- 1. Plantilla: Menú Principal (Selección de Procesos) -->
    <template id="tpl-home">
        <div class="view-container">
            <h2>Selecciona tu proceso</h2>
            <div class="procesos-grid" id="procesos-list">
                <!-- Los botones de procesos se inyectarán aquí -->
            </div>
        </div>
    </template>

    <!-- 2. Plantilla: Ejecución del Proceso (Runner) -->
    <template id="tpl-runner">
        <div class="view-container runner-view">
            <!-- Tiempos (Se eliminó hora actual, se resaltó fin, se añadió inicio) -->
            <div class="time-tracker">
                <div class="time-badge">Inicio: <span class="start-time">--:--</span></div>
                <div class="time-badge highlight">Fin Estimado: <span class="end-time">--:--</span></div>
            </div>

            <!-- Tarea Actual y Progreso -->
            <div class="tarea-card">
                <h3 class="tarea-titulo">Cargando tarea...</h3>
                <div class="progreso-container">
                    <div class="progreso-bar" style="width: 0%;">0%</div>
                </div>
            </div>
            
            <div class="mensaje-display"></div>

            <!-- Controles de Tarea -->
            <div class="action-controls">
                <button data-action="start" class="btn-primary">▶️ Iniciar</button>
                <button data-action="pause" class="btn-warning hidden">⏸️ Pausar</button>
                <button data-action="finish" class="btn-success hidden">✅ Finalizar</button>
            </div>

            <!-- NUEVO: Registro de evidencia (Comentarios y Archivos) -->
            <div class="evidence-section hidden">
                <h4>Registro de la Tarea</h4>
                <textarea class="task-comment" placeholder="Deja notas, observaciones o usa variables como {{nombre}}..."></textarea>
                <input type="file" class="task-file" accept="image/*, audio/*, video/*" multiple>
            </div>
        </div>
    </template>

    <!-- 3. Plantilla: Editor de Procesos (CRUD) -->
    <template id="tpl-editor">
        <div class="view-container editor-view">
            <h2>Gestión de Procesos</h2>
            <button data-action="new-process" class="btn-primary">+ Nuevo Proceso</button>
            <div class="editor-list">
                <!-- Lista editable de procesos y sus pasos -->
            </div>
        </div>
    </template>

    <!-- 4. Plantilla: Configuración -->
    <template id="tpl-settings">
        <div class="view-container settings-view">
            <h2>Configuración del Sistema</h2>
            
            <div class="setting-item">
                <label>
                    <input type="checkbox" id="toggle-voice"> 
                    Habilitar comandos de voz (Micrófono)
                </label>
            </div>
            
            <div class="setting-item">
                <label>
                    <input type="checkbox" id="toggle-speech"> 
                    Habilitar respuestas de voz (Altavoz)
                </label>
            </div>

            <!-- Opciones para variables de usuario -->
            <div class="setting-item">
                <label>Tu Nombre (Para mensajes personalizados):</label>
                <input type="text" id="user-name-input" placeholder="Ej: Jhon">
            </div>
        </div>
    </template>

    <!-- 5. Plantilla: Resultados y Estadísticas -->
    <template id="tpl-stats">
        <div class="view-container stats-view">
            <h2>📊 Resultados del Proceso</h2>
            <div class="charts-container">
                <!-- Gráficos generados por JS -->
            </div>
            <button data-route="home" class="btn-primary">Volver al Inicio</button>
        </div>
    </template>

    <!-- Se eliminó Howler.js y el iframe de Google Forms para mantenerlo nativo e IndexedDB -->
    <script type="module" src="app.js"></script>
</body>
</html>
