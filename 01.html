<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Process Loader - Hazlo Ya</title>
    <style>
        /* ===============================================
           Variables y Tipografía
           =============================================== */
        :root {
            --bg-main: #0f0e0e;
            --bg-card: #143758;
            --bg-card-dark: #0d2136;
            --primary: #2196F3;
            --success: #5cb315;
            --warning: #FFC107;
            --danger: #FF5722;
            --text-light: #e9ecef;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
        }

        h1, h2 { text-align: center; color: #fff; }
        
        .hidden { display: none !important; }

        /* ===============================================
           Contenedores y Tarjetas
           =============================================== */
        .card {
            margin: 20px auto;
            max-width: 600px;
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            padding: 25px;
            text-align: center;
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        /* ===============================================
           Elementos UI (Barras, Botones)
           =============================================== */
        #tiempoTranscurridoContainer {
            background-color: var(--success);
            color: white;
            padding: 12px 0;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #progresoDisplay {
            height: 35px;
            background-color: #3e4858;
            border-radius: 8px;
            overflow: hidden;
            margin: 20px 0;
            border: 2px solid var(--bg-card-dark);
        }

        .progreso-bar {
            height: 100%;
            width: 0%;
            background-color: var(--success);
            transition: width 0.5s ease-out, background-color 0.5s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .progreso-bar.advertencia { background-color: var(--danger); }

        button {
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            padding: 12px 20px;
            border: 2px solid transparent;
            border-radius: 8px;
            background-color: transparent;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 8px;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1); }

        /* Variantes de Botones */
        .btn-outline { border-color: var(--text-light); color: var(--text-light); }
        .btn-outline:hover { background-color: rgba(255,255,255,0.1); }
        
        .btn-primary { border-color: var(--primary); color: var(--primary); }
        .btn-primary:hover { background-color: var(--primary); color: #fff; }
        
        .btn-danger { border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger); color: #fff; }
        
        .btn-warning { border-color: var(--warning); color: var(--warning); }
        .btn-warning:hover { background-color: var(--warning); color: #000; }

        /* ===============================================
           Formulario y Listas (CRUD)
           =============================================== */
        .process-list button { width: 90%; display: block; margin: 10px auto; }
        
        input[type="text"], input[type="number"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 5px 0 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background: #2a3b4c;
            color: white;
        }

        .task-item {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
        }
        
        .stats-item {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary);
            text-align: left;
        }
    </style>
</head>
<body>

    <h1 id="mainTitle">Instalación de Procesos</h1>

    <div class="header-controls">
        <button class="btn-outline" id="musicButton">🎵 Música</button>
        <div id="tiempoTranscurridoContainer">Sistema en Espera</div>
    </div>

    <div id="view-menu" class="view-section active card">
        <h2>Tus Procesos</h2>
        <div id="procesosMenu" class="process-list"></div>
        <hr style="border-color: #3e4858; margin: 20px 0;">
        <button class="btn-outline" onclick="App.CRUD.openEditor()">➕ Crear Nuevo Proceso</button>
        <button class="btn-outline" onclick="App.Stats.show()">📊 Ver Estadísticas</button>
    </div>

    <div id="view-execution" class="view-section card">
        <h2 id="tituloProcesoEjecucion"></h2>
        
        <div id="tareasContainer" class="card" style="background: var(--bg-card-dark); margin-top: 0;">
            <div id="tareaActualDisplay" style="font-size: 1.2em; margin-bottom: 10px;"></div>
            <div id="progresoDisplay"></div> 
        </div>
        
        <div id="mensajeContainer" style="color: var(--primary); font-weight: bold;"></div>
        <div id="estadoContainer" style="color: var(--success); font-weight: bold; margin-top: 10px;"></div>

        <div class="action-controls" style="margin-top: 20px;">
            <button id="botonIniciar" class="btn-primary">▶️ Iniciar Proceso</button>
            <button id="botonPausar" class="btn-warning hidden">⏸️ Pausar Tarea</button>
            <button id="botonFinalizar" class="btn-danger hidden">✅ Finalizar Tarea</button>
            <button id="botonVolver" class="btn-outline hidden" onclick="App.volverAlMenu()">⬅️ Abandonar</button>
        </div>
    </div>

    <div id="view-editor" class="view-section card">
        <h2>Crear / Editar Proceso</h2>
        <input type="text" id="editProcessName" placeholder="Nombre del proceso (ej. Limpieza Profunda)">
        
        <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 15px;">
            <h3>Añadir Tarea</h3>
            <input type="text" id="newTaskName" placeholder="Descripción de la tarea">
            <input type="number" id="newTaskTime" placeholder="Minutos estimados" min="1">
            <button class="btn-primary" onclick="App.CRUD.addTaskToDraft()">+ Añadir Tarea</button>
        </div>

        <div id="draftTasksList"></div>

        <div style="margin-top: 20px;">
            <button class="btn-success" style="border-color: var(--success); color: var(--success);" onclick="App.CRUD.saveProcess()">💾 Guardar Proceso</button>
            <button class="btn-outline" onclick="App.switchView('view-menu')">❌ Cancelar</button>
        </div>
    </div>

    <div id="view-stats" class="view-section card">
        <h2>Historial de Ejecuciones</h2>
        <div id="statsListContainer"></div>
        <button class="btn-outline" style="margin-top: 20px;" onclick="App.switchView('view-menu')">⬅️ Volver al Menú</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script>
        /**
         * DATOS POR DEFECTO Y MENSAJES (Configuración)
         */
        const DEFAULT_PROCESSES = {
            habitacion: {
                id: 'habitacion',
                nombre: "Organizar Habitación 52",
                tareas: [
                    { nombre: "Hacer la cama", tiempoMin: 4 },
                    { nombre: "Despejar superficies", tiempoMin: 10 },
                    { nombre: "Limpiar polvo", tiempoMin: 5 }
                ]
            },
            activacion76: {
                id: 'activacion76',
                nombre: "Rutina de Activación",
                tareas: [
                    { nombre: "Beber agua", tiempoMin: 3 },
                    { nombre: "Aseo dental 🪥", tiempoMin: 5 },
                    { nombre: "Ducha y Vestirse", tiempoMin: 15 }
                ]
            }
        };

        const MSG = {
            ANIMO: ["¡Continúa, lo estás haciendo excelente!", "¡Buen trabajo, sigue el ritmo!", "Casi lo logras, no te detengas."],
            ADVERTENCIA: ["El tiempo se agota, acelera el paso.", "Te estás demorando más de lo previsto."],
            FRASE_INICIO: ["Cargando programa. Inicia la ejecución."]
        };

        /**
         * NÚCLEO DE LA APLICACIÓN
         */
        const App = {
            // Estado Global
            State: {
                procesos: {},         // Todos los procesos (cargados de LocalStorage)
                procesoActivoId: null,
                tareasRestantes: [],
                tareaActual: null,
                historialEjecucion: [], // Para estadísticas
                
                intervaloGlobal: null,
                intervaloTarea: null,
                tiempoInicioGlobal: null,
                isPausado: false,
                
                musicPlayer: null,
                musicPlaying: false
            },

            // Variables para el Editor CRUD
            Draft: {
                id: null,
                nombre: '',
                tareas: []
            },

            DOM: {
                tiempoTotal: document.getElementById('tiempoTranscurridoContainer'),
                tareaActual: document.getElementById('tareaActualDisplay'),
                progreso: document.getElementById('progresoDisplay'),
                mensaje: document.getElementById('mensajeContainer'),
                estado: document.getElementById('estadoContainer'),
                tituloEjecucion: document.getElementById('tituloProcesoEjecucion'),
                
                // Botones Ejecución
                btnIniciar: document.getElementById('botonIniciar'),
                btnPausar: document.getElementById('botonPausar'),
                btnFinalizar: document.getElementById('botonFinalizar'),
                btnVolver: document.getElementById('botonVolver')
            },

            init: function() {
                this.loadData();
                this.initMusic();
                this.addEventListeners();
                this.renderMenu();
                this.switchView('view-menu');
            },

            // --- NAVEGACIÓN (Vistas) ---
            switchView: function(viewId) {
                document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
            },

            volverAlMenu: function() {
                if (this.State.intervaloGlobal || this.State.intervaloTarea) {
                    if(!confirm("¿Estás seguro de abandonar el proceso en curso? No se guardarán las estadísticas.")) return;
                }
                this.limpiarEjecucion();
                this.switchView('view-menu');
            },

            // --- CARGA Y GUARDADO (LocalStorage) ---
            loadData: function() {
                const stored = localStorage.getItem('matrix_procesos');
                if (stored) {
                    this.State.procesos = JSON.parse(stored);
                } else {
                    this.State.procesos = { ...DEFAULT_PROCESSES };
                    this.saveData();
                }

                const stats = localStorage.getItem('matrix_stats');
                if (stats) this.State.estadisticas = JSON.parse(stats);
                else this.State.estadisticas = [];
            },

            saveData: function() {
                localStorage.setItem('matrix_procesos', JSON.stringify(this.State.procesos));
            },

            saveStats: function() {
                localStorage.setItem('matrix_stats', JSON.stringify(this.State.estadisticas));
            },

            // --- UTILIDADES ---
            hablar: function(texto) {
                if (globalThis.speechSynthesis) {
                    globalThis.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(texto);
                    globalThis.speechSynthesis.speak(utterance);
                }
            },

            vibrar: function(patron) {
                if (navigator.vibrate) navigator.vibrate(patron);
            },

            getRandomMsg: function(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            },

            formatTime: function(ms) {
                const totalSec = Math.floor(ms / 1000);
                const min = Math.floor(totalSec / 60);
                const sec = totalSec % 60;
                return `${min}m ${sec}s`;
            },

            // --- MOTOR DE EJECUCIÓN ---
            renderMenu: function() {
                const menu = document.getElementById('procesosMenu');
                menu.innerHTML = '';
                
                Object.values(this.State.procesos).forEach(proceso => {
                    const totalMin = proceso.tareas.reduce((sum, t) => sum + t.tiempoMin, 0);
                    const btn = document.createElement('button');
                    btn.className = 'btn-primary';
                    btn.innerHTML = `<strong>${proceso.nombre}</strong> <br><small>(${proceso.tareas.length} pasos | ~${totalMin} min)</small>`;
                    btn.onclick = () => this.prepararProceso(proceso.id);
                    
                    // Botón para editar
                    const btnEdit = document.createElement('button');
                    btnEdit.className = 'btn-warning';
                    btnEdit.style.width = 'auto';
                    btnEdit.style.display = 'inline-block';
                    btnEdit.innerHTML = '✏️';
                    btnEdit.onclick = (e) => { e.stopPropagation(); this.CRUD.openEditor(proceso.id); };

                    const wrapper = document.createElement('div');
                    wrapper.style.display = 'flex';
                    wrapper.style.alignItems = 'center';
                    wrapper.appendChild(btn);
                    wrapper.appendChild(btnEdit);
                    
                    menu.appendChild(wrapper);
                });
            },

            prepararProceso: function(id) {
                const proceso = this.State.procesos[id];
                this.State.procesoActivoId = id;
                this.State.tareasRestantes = JSON.parse(JSON.stringify(proceso.tareas)); // Copia profunda
                this.State.historialEjecucion = []; // Reiniciar stats de esta corrida

                this.DOM.tituloEjecucion.textContent = `Proceso: ${proceso.nombre}`;
                this.DOM.btnIniciar.classList.remove('hidden');
                this.DOM.btnPausar.classList.add('hidden');
                this.DOM.btnFinalizar.classList.add('hidden');
                this.DOM.btnVolver.classList.remove('hidden');
                
                this.DOM.tareaActual.innerHTML = "Listo para iniciar...";
                this.DOM.progreso.innerHTML = '';
                this.DOM.mensaje.innerHTML = '';

                this.switchView('view-execution');
            },

            iniciarProceso: function() {
                this.State.tiempoInicioGlobal = Date.now();
                this.DOM.btnIniciar.classList.add('hidden');
                this.DOM.btnPausar.classList.remove('hidden');
                this.DOM.btnFinalizar.classList.remove('hidden');

                this.State.intervaloGlobal = setInterval(() => this.updateUI(), 1000);
                this.hablar(this.getRandomMsg(MSG.FRASE_INICIO));
                this.siguienteTarea();
            },

            siguienteTarea: function() {
                if (this.State.tareaActual) {
                    clearInterval(this.State.intervaloTarea);
                }

                if (this.State.tareasRestantes.length === 0) {
                    this.finalizarProcesoCompleto();
                    return;
                }

                const tareaData = this.State.tareasRestantes.shift();
                this.State.tareaActual = {
                    ...tareaData,
                    tiempoTotalMs: tareaData.tiempoMin * 60 * 1000,
                    inicioMs: Date.now(),
                    mensajePrevioPct: 0
                };

                this.DOM.mensaje.innerHTML = `Siguiente instrucción: <strong>${this.State.tareaActual.nombre}</strong>`;
                this.hablar(`Tarea: ${this.State.tareaActual.nombre}. Tiempo estimado: ${this.State.tareaActual.tiempoMin} minutos.`);
                
                this.State.intervaloTarea = setInterval(() => this.updateUI(), 1000);
            },

            finalizarTarea: function() {
                if (!this.State.tareaActual) return;
                
                const tiempoRealMs = Date.now() - this.State.tareaActual.inicioMs;
                
                // Guardar en historial temporal
                this.State.historialEjecucion.push({
                    nombre: this.State.tareaActual.nombre,
                    estimadoMs: this.State.tareaActual.tiempoTotalMs,
                    realMs: tiempoRealMs
                });

                this.vibrar([100, 50, 100]); // Haptic feedback positivo
                this.siguienteTarea();
            },

            finalizarProcesoCompleto: function() {
                this.limpiarEjecucion();
                
                // Guardar estadísticas
                const proceso = this.State.procesos[this.State.procesoActivoId];
                this.State.estadisticas.push({
                    procesoNombre: proceso.nombre,
                    fecha: new Date().toLocaleString(),
                    tareas: this.State.historialEjecucion
                });
                this.saveStats();

                this.vibrar([300, 100, 300, 100, 500]);
                this.hablar("Programa ejecutado con éxito. Secuencia terminada.");
                alert("¡Proceso completado! Estadísticas guardadas.");
                this.switchView('view-menu');
            },

            limpiarEjecucion: function() {
                clearInterval(this.State.intervaloGlobal);
                clearInterval(this.State.intervaloTarea);
                this.State.intervaloGlobal = null;
                this.State.intervaloTarea = null;
                this.State.tareaActual = null;
                this.State.procesoActivoId = null;
                this.DOM.tiempoTotal.innerHTML = "Sistema en Espera";
            },

            updateUI: function() {
                if (this.State.isPausado || !this.State.tareaActual) return;

                // Tiempo Global
                const elapsedGlobal = Date.now() - this.State.tiempoInicioGlobal;
                this.DOM.tiempoTotal.innerHTML = `Tiempo Total Transcurrido: ${this.formatTime(elapsedGlobal)}`;

                // Tarea Actual
                const tarea = this.State.tareaActual;
                const tiempoTranscurrido = Date.now() - tarea.inicioMs;
                const porcentaje = (tiempoTranscurrido / tarea.tiempoTotalMs) * 100;

                this.DOM.tareaActual.innerHTML = `<strong>Tarea:</strong> ${tarea.nombre} <br> Usado: ${this.formatTime(tiempoTranscurrido)}`;

                // Barra de progreso
                let progressBar = this.DOM.progreso.querySelector('.progreso-bar');
                if (!progressBar) {
                    progressBar = document.createElement('div');
                    progressBar.className = 'progreso-bar';
                    this.DOM.progreso.appendChild(progressBar);
                }

                progressBar.style.width = `${Math.min(porcentaje, 100)}%`;
                progressBar.textContent = `${Math.round(porcentaje)}%`;

                if (porcentaje >= 100) {
                    progressBar.classList.add('advertencia');
                    if (porcentaje > 100 && porcentaje < 102) {
                        this.vibrar([500]); // Alerta de tiempo excedido
                        this.hablar(this.getRandomMsg(MSG.ADVERTENCIA));
                    }
                }
            },

            togglePausa: function() {
                if (!this.State.tareaActual) return;
                this.State.isPausado = !this.State.isPausado;
                
                if (this.State.isPausado) {
                    this.DOM.btnPausar.innerHTML = '▶️ Reanudar';
                    this.DOM.tiempoTotal.innerHTML += " [PAUSADO]";
                } else {
                    this.DOM.btnPausar.innerHTML = '⏸️ Pausar Tarea';
                    // Compensar tiempo
                    const tiempoPausado = Date.now() - this.State.tareaActual.inicioMs;
                    this.State.tareaActual.inicioMs = Date.now() - tiempoPausado;
                }
            },

            // --- SISTEMA CRUD (Crear/Editar) ---
            CRUD: {
                openEditor: function(id = null) {
                    const self = App;
                    const listContainer = document.getElementById('draftTasksList');
                    listContainer.innerHTML = '';

                    if (id && self.State.procesos[id]) {
                        // Modo Edición
                        const proc = self.State.procesos[id];
                        self.Draft.id = id;
                        self.Draft.nombre = proc.nombre;
                        self.Draft.tareas = [...proc.tareas];
                    } else {
                        // Modo Creación
                        self.Draft.id = 'proc_' + Date.now();
                        self.Draft.nombre = '';
                        self.Draft.tareas = [];
                    }

                    document.getElementById('editProcessName').value = self.Draft.nombre;
                    this.renderDraftTasks();
                    self.switchView('view-editor');
                },

                addTaskToDraft: function() {
                    const nameInput = document.getElementById('newTaskName');
                    const timeInput = document.getElementById('newTaskTime');
                    
                    if (!nameInput.value || !timeInput.value) return alert("Llena ambos campos");

                    App.Draft.tareas.push({
                        nombre: nameInput.value,
                        tiempoMin: parseInt(timeInput.value)
                    });

                    nameInput.value = '';
                    timeInput.value = '';
                    this.renderDraftTasks();
                },

                removeTaskFromDraft: function(index) {
                    App.Draft.tareas.splice(index, 1);
                    this.renderDraftTasks();
                },

                renderDraftTasks: function() {
                    const container = document.getElementById('draftTasksList');
                    container.innerHTML = '';
                    App.Draft.tareas.forEach((t, index) => {
                        const div = document.createElement('div');
                        div.className = 'task-item';
                        div.innerHTML = `
                            <span>${index + 1}. ${t.nombre} (${t.tiempoMin} min)</span>
                            <button class="btn-danger" style="padding: 5px 10px; margin:0;" onclick="App.CRUD.removeTaskFromDraft(${index})">X</button>
                        `;
                        container.appendChild(div);
                    });
                },

                saveProcess: function() {
                    const name = document.getElementById('editProcessName').value;
                    if (!name || App.Draft.tareas.length === 0) return alert("Falta nombre o tareas.");

                    App.State.procesos[App.Draft.id] = {
                        id: App.Draft.id,
                        nombre: name,
                        tareas: App.Draft.tareas
                    };

                    App.saveData();
                    App.renderMenu();
                    App.switchView('view-menu');
                }
            },

            // --- ESTADÍSTICAS ---
            Stats: {
                show: function() {
                    const container = document.getElementById('statsListContainer');
                    container.innerHTML = '';

                    if (App.State.estadisticas.length === 0) {
                        container.innerHTML = '<p>No hay datos aún. Completa un proceso primero.</p>';
                    } else {
                        // Mostrar las últimas 10 ejecuciones invirtiendo el array
                        const reversed = [...App.State.estadisticas].reverse().slice(0, 10);
                        reversed.forEach(stat => {
                            let timeAnalysisHTML = '';
                            stat.tareas.forEach(t => {
                                const realMin = (t.realMs / 60000).toFixed(1);
                                const estMin = (t.estimadoMs / 60000).toFixed(1);
                                const color = t.realMs > t.estimadoMs ? 'var(--danger)' : 'var(--success)';
                                timeAnalysisHTML += `<div style="font-size: 0.9em; margin-left: 10px;">- ${t.nombre}: <span style="color:${color}">${realMin}m</span> (Est: ${estMin}m)</div>`;
                            });

                            const div = document.createElement('div');
                            div.className = 'stats-item';
                            div.innerHTML = `
                                <strong>${stat.procesoNombre}</strong> <small style="float:right">${stat.fecha}</small>
                                <div style="margin-top:10px;">${timeAnalysisHTML}</div>
                            `;
                            container.appendChild(div);
                        });
                    }
                    App.switchView('view-stats');
                }
            },

            // --- EVENTOS INICIALES ---
            addEventListeners: function() {
                this.DOM.btnIniciar.addEventListener('click', () => this.iniciarProceso());
                this.DOM.btnPausar.addEventListener('click', () => this.togglePausa());
                this.DOM.btnFinalizar.addEventListener('click', () => this.finalizarTarea());
                document.getElementById('musicButton').addEventListener('click', () => this.toggleMusic());
            },

            initMusic: function() {
                this.State.musicPlayer = new Howl({
                    src: ['https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'],
                    loop: true,
                    volume: 0.5
                });
            },

            toggleMusic: function() {
                const btn = document.getElementById('musicButton');
                if (this.State.musicPlaying) {
                    this.State.musicPlayer.pause();
                    btn.textContent = '🎵 Música OFF';
                } else {
                    this.State.musicPlayer.play();
                    btn.textContent = '🎶 Música ON';
                }
                this.State.musicPlaying = !this.State.musicPlaying;
            }
        };

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
