<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensaje Mágico en Partículas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Canvas de fondo completo */
        #particleCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Botón Menú Hamburguesa Flotante */
        .hamburger-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1.4rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            opacity: 0.5;
        }

        .hamburger-btn:hover {
            opacity: 1;
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
            box-shadow: 0 0 12px #00ffff;
        }

        /* Panel Desplegable Oculto */
        .control-panel {
            position: fixed;
            top: 75px;
            right: 20px;
            background: rgba(12, 12, 20, 0.92);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            z-index: 99;
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 290px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            transform: translateY(-20px) scale(0.95);
            opacity: 0;
            pointer-events: none;
        }

        .control-panel.active {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: all;
        }

        .control-panel label {
            font-size: 0.85rem;
            color: #aaa;
        }

        .control-panel input[type="text"], .control-panel select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 255, 0.5);
            background: #090910;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .control-panel button {
            padding: 10px;
            border-radius: 6px;
            border: none;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .control-panel button:hover {
            opacity: 0.9;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: #ddd;
            cursor: pointer;
        }

        #shareInfo {
            font-size: 0.75rem;
            color: #00ffff;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Botón Menú Hamburguesa -->
    <button id="menuBtn" class="hamburger-btn" title="Configuración">☰</button>

    <!-- Menú Desplegable -->
    <div id="controlPanel" class="control-panel">
        <label for="textInput">Mensaje personalizado:</label>
        <input type="text" id="textInput" value="Feliz dia tio Fairo">

        <label for="themeSelect">Tema de Color:</label>
        <select id="themeSelect">
            <option value="gold">Dorado Cumpleaños 🎆</option>
            <option value="rainbow">Arcoíris Neón 🌈</option>
            <option value="cyberpunk">Ciberpunk (Cyan/Pink) ⚡</option>
            <option value="matrix">Matrix Green 🟩</option>
            <option value="blue">Azul Neón 💎</option>
        </select>

        <label for="animSelect">Estilo de Animación:</label>
        <select id="animSelect">
            <option value="fly">Partículas Voladoras (Fly-In)</option>
            <option value="pulse">Onda Radiante</option>
            <option value="explode">Explosión Mágica</option>
        </select>

        <label class="checkbox-group">
            <input type="checkbox" id="confettiCheck" checked>
            Activar Confeti de Cumpleaños
        </label>

        <button id="replayBtn">▶ Reproducir Animación</button>
        <button id="copyUrlBtn">🔗 Copiar Enlace Personalizado</button>
        <div id="shareInfo">¡Enlace copiado!</div>
    </div>

    <!-- Canvas Principal -->
    <canvas id="particleCanvas"></canvas>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let particles = [];
        let confetti = [];
        let hueOffset = 0;
        let animFrameId = null;

        // Mouse Tracker para interacción
        const mouse = { x: null, y: null, radius: 80 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });

        window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initEngine();
        });

        // Clase Partícula para el texto
        class Particle {
            constructor(targetX, targetY, theme, animType) {
                this.targetX = targetX;
                this.targetY = targetY;
                this.size = Math.min(width, height) < 600 ? 2.5 : 3.5;
                this.theme = theme;

                // Posición Inicial según tipo de animación
                if (animType === 'fly') {
                    // Partículas viajan desde los bordes fuera de pantalla
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.max(width, height) * 1.2;
                    this.x = width / 2 + Math.cos(angle) * distance;
                    this.y = height / 2 + Math.sin(angle) * distance;
                } else if (animType === 'explode') {
                    // Nacen en el centro y se expanden
                    this.x = width / 2 + (Math.random() - 0.5) * 50;
                    this.y = height / 2 + (Math.random() - 0.5) * 50;
                } else {
                    // Onda desde arriba
                    this.x = targetX + (Math.random() - 0.5) * 200;
                    this.y = -50 - Math.random() * 200;
                }

                this.vx = 0;
                this.vy = 0;
                this.friction = 0.88;
                this.ease = 0.07 + Math.random() * 0.04; // Velocidad de vuelo
                this.baseHue = Math.random() * 60;
            }

            getColor(time) {
                switch (this.theme) {
                    case 'gold':
                        return `hsl(${38 + Math.sin(time * 0.002 + this.baseHue) * 15}, 100%, ${55 + Math.random() * 20}%)`;
                    case 'rainbow':
                        return `hsl(${(hueOffset + this.targetX * 0.2) % 360}, 100%, 65%)`;
                    case 'cyberpunk':
                        return this.targetX % 20 < 10 ? '#00ffff' : '#ff00ff';
                    case 'matrix':
                        return `#00ff${Math.floor(100 + Math.random() * 155).toString(16)}`;
                    case 'blue':
                    default:
                        return `hsl(${185 + Math.sin(time * 0.003) * 20}, 100%, 60%)`;
                }
            }

            update(time) {
                // Atracción física a la posición destino (Target)
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;

                this.vx += dx * this.ease;
                this.vy += dy * this.ease;

                this.vx *= this.friction;
                this.vy *= this.friction;

                this.x += this.vx;
                this.y += this.vy;

                // Repulsión con el ratón / dedo
                if (mouse.x !== null && mouse.y !== null) {
                    const mdx = this.x - mouse.x;
                    const mdy = this.y - mouse.y;
                    const dist = Math.sqrt(mdx * mdx + mdy * mdy);

                    if (dist < mouse.radius) {
                        const force = (mouse.radius - dist) / mouse.radius;
                        const angle = Math.atan2(mdy, mdx);
                        this.x += Math.cos(angle) * force * 15;
                        this.y += Math.sin(angle) * force * 15;
                    }
                }
            }

            draw(time) {
                ctx.fillStyle = this.getColor(time);
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Partículas de Confeti
        class Confetti {
            constructor() {
                this.x = Math.random() * width;
                this.y = -20;
                this.size = Math.random() * 6 + 4;
                this.speedY = Math.random() * 3 + 2;
                this.speedX = (Math.random() - 0.5) * 2;
                this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                this.rotation = Math.random() * 360;
                this.spin = (Math.random() - 0.5) * 10;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.spin;

                if (this.y > height + 20) {
                    this.y = -20;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        // Generar mapa de coordenadas desde el texto
        function createTextTargetPoints(text) {
            const offscreen = document.createElement('canvas');
            const offCtx = offscreen.getContext('2d');
            
            offscreen.width = width;
            offscreen.height = height;

            // Tamaño adaptativo del texto
            let fontSize = Math.min(width / (text.length * 0.7), 110);
            fontSize = Math.max(fontSize, 28);

            offCtx.fillStyle = '#ffffff';
            offCtx.font = `bold ${fontSize}px 'Segoe UI', Arial, sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';

            // Dibujar palabras en múltiples líneas si es necesario
            const words = text.split(' ');
            let lines = [];
            let currentLine = words[0] || '';

            for (let i = 1; i < words.length; i++) {
                let testLine = currentLine + ' ' + words[i];
                let metrics = offCtx.measureText(testLine);
                if (metrics.width > width * 0.85) {
                    lines.push(currentLine);
                    currentLine = words[i];
                } else {
                    currentLine = testLine;
                }
            }
            lines.push(currentLine);

            const lineHeight = fontSize * 1.25;
            const startY = height / 2 - ((lines.length - 1) * lineHeight) / 2;

            lines.forEach((line, index) => {
                offCtx.fillText(line, width / 2, startY + index * lineHeight);
            });

            // Leer información de píxeles
            const imgData = offCtx.getImageData(0, 0, width, height).data;
            const points = [];
            const step = Math.min(width, height) < 600 ? 6 : 8; // Densidad de puntos

            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const alpha = imgData[(y * width + x) * 4 + 3];
                    if (alpha > 128) {
                        points.push({ x, y });
                    }
                }
            }

            return points;
        }

        function initEngine() {
            const text = document.getElementById('textInput').value || 'Feliz dia';
            const theme = document.getElementById('themeSelect').value;
            const animType = document.getElementById('animSelect').value;
            const hasConfetti = document.getElementById('confettiCheck').checked;

            const targets = createTextTargetPoints(text);
            particles = targets.map(pt => new Particle(pt.x, pt.y, theme, animType));

            confetti = [];
            if (hasConfetti) {
                for (let i = 0; i < 70; i++) {
                    confetti.push(new Confetti());
                }
            }
        }

        function animate(time = 0) {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.25)'; // Rastro brillante
            ctx.fillRect(0, 0, width, height);

            hueOffset += 1;

            particles.forEach(p => {
                p.update(time);
                p.draw(time);
            });

            confetti.forEach(c => {
                c.update();
                c.draw();
            });

            animFrameId = requestAnimationFrame(animate);
        }

        // Configuración de eventos UI
        document.getElementById('menuBtn').addEventListener('click', () => {
            document.getElementById('controlPanel').classList.toggle('active');
        });

        document.getElementById('replayBtn').addEventListener('click', () => {
            initEngine();
        });

        document.getElementById('copyUrlBtn').addEventListener('click', () => {
            const text = document.getElementById('textInput').value;
            const theme = document.getElementById('themeSelect').value;
            const anim = document.getElementById('animSelect').value;

            const url = `${window.location.origin}${window.location.pathname}?mensaje=${encodeURIComponent(text)}&theme=${theme}&anim=${anim}`;

            navigator.clipboard.writeText(url).then(() => {
                const info = document.getElementById('shareInfo');
                info.style.display = 'block';
                setTimeout(() => info.style.display = 'none', 2500);
            });
        });

        // Lectura de parámetros de la URL
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.has('mensaje')) document.getElementById('textInput').value = params.get('mensaje');
            if (params.has('theme')) document.getElementById('themeSelect').value = params.get('theme');
            if (params.has('anim')) document.getElementById('animSelect').value = params.get('anim');

            initEngine();
            animate();
        });
    </script>
</body>
</html>
